function setupJS(){let w=null,code=document.querySelector("#jscode"),out=document.querySelector("#jsout"),teach=document.querySelector("#teacher");function stop(){if(w)w.terminate();w=null}document.querySelector("#runjs").onclick=function(){stop();out.className="out";out.textContent="Running...";let src='self.console={log:function(){postMessage({t:"log",v:[...arguments]})},warn:function(){postMessage({t:"warn",v:[...arguments]})},error:function(){postMessage({t:"error",v:[...arguments]})}};self.onmessage=async function(e){try{let AF=Object.getPrototypeOf(async function(){}).constructor;let r=await new AF(e.data)();postMessage({t:"done",v:r})}catch(x){postMessage({t:"err",n:x.name,m:x.message,s:x.stack})}}';w=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})));w.onmessage=function(e){let m=e.data;if(m.t==="log"||m.t==="warn"||m.t==="error"){out.textContent+=(out.textContent==="Running..."?"":"\n")+m.t.toUpperCase()+": "+m.v.map(function(x){return typeof x==="object"?JSON.stringify(x):String(x)}).join(" ")}else if(m.t==="done"){out.textContent+="\nDONE";out.className="out ok"}else{out.textContent="✖ "+m.n+": "+m.m+"\n\n"+m.s;out.className="out err";teach.innerHTML="<b>Error teacher:</b> "+teachError(m.n,m.m)}};w.postMessage(code.value)};document.querySelector("#stopjs").onclick=function(){stop();out.textContent="Stopped."};document.querySelector("#clearjs").onclick=function(){out.textContent=""};document.querySelector("#asyncjs").onclick=function(){code.value='console.log("A");\nPromise.resolve().then(()=>console.log("microtask"));\nsetTimeout(()=>console.log("task"),0);\nconsole.log("B");'};document.querySelector("#badjs").onclick=function(){code.value='const n=42;\nconsole.log(n.toUpperCase());'}}

its()">Convert</button><div id="br" class="result"></div></section></div>'}

function dsaLab(){return '<section class="hero"><h1>DSA Judge</h1><p>Real execution against visible tests. Because this is static, tests are intentionally not advertised as secret.</p></section><section class="card"><h2>Challenge: maximum subarray</h2><p>Write <code>maxSubarray(a)</code>. Return the largest sum of a non-empty contiguous subarray.</p><textarea id="dcode" class="editor">function maxSubarray(a){\n let best=a[0],cur=a[0];\n for(let i=1;i<a.length;i++){cur=Math.max(a[i],cur+a[i]);best=Math.max(best,cur)}\n return best;\n}</textarea><p><button class="primary" id="rund">Run tests</button> <button id="breakd">Break it</button></p><div id="dout" class="result">No tests yet.</div></section>'}
