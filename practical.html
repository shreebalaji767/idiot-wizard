<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDIOT → WIZARD Practical Lab</title>
<style>
:root{--b:#070b14;--p:#101a2c;--l:#2b3a58;--t:#eef3ff;--m:#aab6cd;--a:#8b5cf6;--g:#22c55e;--r:#ef4444}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#211438,#070b14 58%);color:var(--t);font:15px/1.55 system-ui}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:18px;background:#080e19;border-right:1px solid var(--l);position:sticky;top:0;height:100vh}.side button{width:100%;text-align:left;margin:4px 0}.active{background:#281748;border-color:#7048b8}.main{max-width:1450px;width:100%;padding:24px;margin:auto}.hero,.card,.panel{background:rgba(16,26,44,.94);border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:13px}.hero{background:linear-gradient(135deg,#291747,#10263b)}h1{font-size:clamp(30px,5vw,54px);line-height:1.05}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.editor,.out,.field{width:100%;background:#050910;color:#d1fae5;border:1px solid var(--l);border-radius:9px;padding:12px;font:13px/1.5 ui-monospace,monospace}.editor{min-height:320px;resize:vertical}.out{min-height:220px;white-space:pre-wrap;overflow:auto}.field{font-family:inherit;color:var(--t);margin:4px 0}button{cursor:pointer;background:#17243c;color:var(--t);border:1px solid var(--l);border-radius:9px;padding:9px 12px}.primary{background:var(--a);border-color:var(--a)}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.result{white-space:pre-wrap;background:#070c15;border:1px solid var(--l);padding:10px;border-radius:8px;margin-top:8px}.teacher{border-left:5px solid var(--a);background:#18112b;padding:12px;border-radius:8px}.hidden{display:none!important}.good{color:#86efac}.bad{color:#fca5a5}@media(max-width:800px){.app{display:block}.side{position:relative;height:auto}.main{padding:12px}}
</style></head><body><div class="app"><aside class="side"><b style="font-size:22px">IDIOT <span style="color:#a78bfa">→</span> WIZARD</b><p style="color:var(--m)">REAL work only.</p><button data-tab="js">⚙️ JavaScript</button><button data-tab="math">∑ Mathematics</button><button data-tab="dsa">🧩 DSA Judge</button><button data-tab="errors">🐛 Error Teacher</button><hr><a href="index.html">← Dashboard</a><br><a href="learn.html">← Curriculum</a></aside><main class="main"><section class="hero"><span style="color:var(--m)">CLIENT-SIDE • NO FAKE OUTPUT</span><h1>Practical Lab</h1><p>Run → break → inspect → fix → test. The browser actually calculates and executes.</p></section><div id="js"></div><div id="math" class="hidden"></div><div id="dsa" class="hidden"></div><div id="errors" class="hidden"></div></main></div>
<script>
var $=function(s){return document.querySelector(s)}, $$=function(s){return Array.from(document.querySelectorAll(s))};
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function teach(msg,why){return '<div class="teacher"><b>🤡 Error teacher</b><p>'+esc(msg)+'</p><p><b>Why:</b> '+esc(why||'Read the first useful error, inspect the input and change one thing at a time.')+'</p></div>'}
function show(id){$$('[id]').forEach(function(x){if(['js','math','dsa','errors'].includes(x.id))x.classList.toggle('hidden',x.id!==id)});$$('.side button').forEach(function(b){b.classList.toggle('active',b.dataset.tab===id)})}
$$('.side button').forEach(function(b){b.onclick=function(){show(b.dataset.tab)}});
$('#js').innerHTML='<div class="card"><h2>Real JavaScript execution</h2><p>Code runs in a disposable Web Worker. Console output, exceptions, timers and promises are real browser behavior.</p><textarea id="code" class="editor">console.log("Hello, wizard");\nconst a=[1,2,3,4];\nconsole.log("sum =",a.reduce((x,y)=>x+y,0));</textarea><div class="row"><button class="primary" id="run">▶ Run</button><button id="stop">■ Stop</button><button id="async">Async ordering</button><button id="break">💥 Break it</button></div><pre id="jsout" class="out">Ready.</pre><div id="jsteach"></div></div><div class="card"><b>Important:</b> execution success is not correctness. A program can print perfectly wrong answers.</div>';
var worker=null;
$('#run').onclick=function(){runCode($('#code').value)};
$('#stop').onclick=function(){if(worker)worker.terminate();worker=null;$('#jsout').textContent+='\n■ Worker terminated.'};
$('#async').onclick=function(){$('#code').value='console.log("A");\nsetTimeout(()=>console.log("timer"),0);\nPromise.resolve().then(()=>console.log("microtask"));\nconsole.log("B");'};
$('#break').onclick=function(){$('#code').value='const user={name:"Idiot"};\nconsole.log(user.profile.name);';runCode($('#code').value)};
function runCode(code){if(worker)worker.terminate();$('#jsout').textContent='Running…';$('#jsteach').innerHTML='';var src='const send=(t,v)=>postMessage({t,v});console.log=(...a)=>send("log",a.map(x=>{try{return typeof x==="string"?x:JSON.stringify(x)}catch(e){return String(x)}}).join(" "));self.onerror=(m,u,l)=>send("err",m+" @ line "+l);self.onunhandledrejection=e=>send("err","Unhandled rejection: "+e.reason);try{'+code+'}catch(e){send("err",e.stack||String(e))}';worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));var killed=setTimeout(function(){if(worker){worker.terminate();worker=null;$('#jsout').textContent+='\n⏱ stopped after 3 seconds';$('#jsteach').innerHTML=teach('Execution exceeded the safety limit.','Likely infinite loop, runaway recursion or explosive work. Reduce the input and trace the stopping condition.')}},3000);worker.onmessage=function(e){if(e.data.t==='log')$('#jsout').textContent+=($('#jsout').textContent==='Running…'?'':'\n')+e.data.v;else{$('#jsout').textContent+='\n❌ '+e.data.v;$('#jsteach').innerHTML=teach(e.data.v,'This is evidence. Find the operation and inspect the value that violated its expectation.')}};worker.onerror=function(e){$('#jsout').textContent+='\n❌ '+e.message;$('#jsteach').innerHTML=teach(e.message,'The source could not execute normally. Check syntax, names, types and the reported line.')};setTimeout(function(){clearTimeout(killed)},3050)}

$('#math').innerHTML='<div class="card"><h2>Real Mathematics Calculators</h2><p>Arithmetic, GCD/LCM, primes, modular arithmetic, quadratics, combinations, statistics, vectors, roots and base conversion.</p></div><div class="grid">'+
'<div class="panel"><h3>Arithmetic</h3><input id="ma" class="field" value="125"><input id="mb" class="field" value="80"><button onclick="basic()">Calculate</button><div id="mr1" class="result"></div></div>'+
'<div class="panel"><h3>GCD / LCM</h3><input id="ga" class="field" value="84"><input id="gb" class="field" value="30"><button onclick="gcdcalc()">Calculate</button><div id="mr2" class="result"></div></div>'+
'<div class="panel"><h3>Prime factorization</h3><input id="pa" class="field" value="360"><button onclick="prime()">Calculate</button><div id="mr3" class="result"></div></div>'+
'<div class="panel"><h3>Modular power</h3><input id="xa" class="field" value="7"><input id="xe" class="field" value="128"><input id="xm" class="field" value="13"><button onclick="modcalc()">Calculate</button><div id="mr4" class="result"></div></div>'+
'<div class="panel"><h3>Quadratic ax²+bx+c=0</h3><input id="qa" class="field" value="1"><input id="qb" class="field" value="-5"><input id="qc" class="field" value="6"><button onclick="quad()">Solve</button><div id="mr5" class="result"></div></div>'+
'<div class="panel"><h3>nCk / nPk</h3><input id="cn" class="field" value="10"><input id="ck" class="field" value="3"><button onclick="comb()">Calculate</button><div id="mr6" class="result"></div></div>'+
'<div class="panel"><h3>Statistics</h3><input id="sa" class="field" value="2,4,4,4,5,5,7,9"><button onclick="stats()">Calculate</button><div id="mr7" class="result"></div></div>'+
'<div class="panel"><h3>Vector dot product</h3><input id="va" class="field" value="1,2,3"><input id="vb" class="field" value="4,5,6"><button onclick="vec()">Calculate</button><div id="mr8" class="result"></div></div>'+
'<div class="panel"><h3>Bisection root</h3><input id="fx" class="field" value="x*x-2"><input id="fa" class="field" value="0"><input id="fb" class="field" value="2"><button onclick="bisect()">Find root</button><div id="mr9" class="result"></div></div>'+
'<div class="panel"><h3>Base conversion</h3><input id="bn" class="field" value="255"><input id="bf" class="field" value="10"><input id="bt" class="field" value="16"><button onclick="base()">Convert</button><div id="mr10" class="result"></div></div></div>';
function basic(){var a=+$('#ma').value,b=+$('#mb').value;$('#mr1').textContent='a+b = '+(a+b)+'\na-b = '+(a-b)+'\na×b = '+a*b+'\na÷b = '+a/b+'\na is '+(100*a/b)+'% of b'}
function gcdnum(a,b){a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a}
function gcdcalc(){var a=+$('#ga').value,b=+$('#gb').value,g=gcdnum(a,b);$('#mr2').textContent='GCD = '+g+'\nLCM = '+Math.abs(a/g*b)}
function prime(){var n=+$('#pa').value;if(!Number.isInteger(n)||n<2){$('#mr3').textContent='Enter integer ≥ 2';return}var x=n,f=[];for(var p=2;p*p<=x;p++)while(x%p===0){f.push(p);x/=p}if(x>1)f.push(x);$('#mr3').textContent='Prime: '+(f.length===1)+'\nFactors: '+f.join(' × ')}
function modpow(a,e,m){a=BigInt(a);e=BigInt(e);m=BigInt(m);var r=1n;a=(a%m+m)%m;while(e){if(e&1n)r=r*a%m;a=a*a%m;e>>=1n}return r}
function modcalc(){$('#mr4').textContent='a^e mod m = '+modpow($('#xa').value,$('#xe').value,$('#xm').value)}
function quad(){var a=+$('#qa').value,b=+$('#qb').value,c=+$('#qc').value,D=b*b-4*a*c;if(a===0){$('#mr5').textContent=b?'x = '+(-c/b):'Invalid equation';return}if(D>=0)$('#mr5').textContent='D = '+D+'\nx1 = '+((-b+Math.sqrt(D))/(2*a))+'\nx2 = '+((-b-Math.sqrt(D))/(2*a));else $('#mr5').textContent='D = '+D+'\nx = '+(-b/(2*a))+' ± '+(Math.sqrt(-D)/(2*a))+'i'}
function fact(n){var r=1n;for(var i=2n;i<=BigInt(n);i++)r*=i;return r}
function comb(){var n=+$('#cn').value,k=+$('#ck').value;if(k<0||k>n){$('#mr6').textContent='Require 0 ≤ k ≤ n';return}$('#mr6').textContent='nCk = '+fact(n)/(fact(k)*fact(n-k))+'\nnPk = '+fact(n)/fact(n-k)}
function stats(){var a=$('#sa').value.split(',').map(Number).filter(Number.isFinite).sort((x,y)=>x-y),n=a.length,m=a.reduce((x,y)=>x+y,0)/n,v=a.reduce((s,x)=>s+(x-m)**2,0)/n;$('#mr7').textContent='n = '+n+'\nmean = '+m+'\nmedian = '+(n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2)+'\nvariance = '+v+'\nSD = '+Math.sqrt(v)}
function vec(){var a=$('#va').value.split(',').map(Number),b=$('#vb').value.split(',').map(Number);if(a.length!==b.length){$('#mr8').textContent='Dimensions differ';return}$('#mr8').textContent='dot = '+a.reduce((s,x,i)=>s+x*b[i],0)+'\n||a|| = '+Math.hypot(...a)+'\n||b|| = '+Math.hypot(...b)}
function bisect(){var fn;try{fn=new Function('x','return '+$('#fx').value)}catch(e){$('#mr9').textContent=e.toString();return}var a=+$('#fa').value,b=+$('#fb').value,fa=fn(a),fb=fn(b);if(fa*fb>0){$('#mr9').textContent='Endpoint values must have opposite signs.';return}var m=0;for(var i=0;i<100;i++){m=(a+b)/2;var fm=fn(m);if(Math.abs(fm)<1e-12)break;if(fa*fm<=0){b=m;fb=fm}else{a=m;fa=fm}}$('#mr9').textContent='root ≈ '+m+'\nf(root) ≈ '+fn(m)}
function base(){try{var n=BigInt(parseInt($('#bn').value,+$('#bf').value));$('#mr10').textContent='decimal = '+n+'\nbase '+$('#bt').value+' = '+n.toString(+$('#bt').value)}catch(e){$('#mr10').textContent='Invalid base/value'}}

$('#dsa').innerHTML='<div class="card"><h2>Real DSA Judge</h2><p>Visible tests execute your function and compare expected vs actual. Because this is static, tests cannot be secret.</p><select id="prob" class="field"><option value="two">Two Sum</option><option value="max">Maximum Subarray</option><option value="bin">Binary Search</option><option value="pal">Palindrome</option><option value="br">Valid Brackets</option></select><textarea id="dc" class="editor">function solve(a,target){\n  const seen=new Map();\n  for(let i=0;i<a.length;i++){\n    const need=target-a[i];\n    if(seen.has(need)) return [seen.get(need),i];\n    seen.set(a[i],i);\n  }\n  return [];\n}</textarea><div class="row"><button class="primary" onclick="judge()">▶ Judge</button><button onclick="broken()">💥 Broken version</button></div><pre id="do" class="out">Ready.</pre><div id="dt"></div></div>';
var tests={two:[[[2,7,11,15],9],[[-1,-2,-3,-4],-6],[[3,3],6]],max:[[[ -2,1,-3,4,-1,2,1,-5,4]],6],[[[-5,-2,-8]],-2]],bin:[[[1,3,5,7,9],7,3],[[1,3,5,7,9],2,-1]],pal:[[['racecar'],true],[['hello'],false],[[''],true]],br:[[['()[]{}'],true],[['([)]'],false],[['{'],false]]]};
function judge(){var p=$('#prob').value,fn;try{fn=new Function($('#dc').value+';return solve;')()}catch(e){$('#do').textContent=e.stack||String(e);$('#dt').innerHTML=teach(e.toString(),'Syntax errors stop parsing; runtime errors happen after execution begins. Fix the first reported problem.') ;return}var out=[],pass=0;tests[p].forEach(function(t,i){var args=t[0],expected=t[1],actual,err='';var st=performance.now();try{actual=fn.apply(null,args)}catch(e){err=e.stack||String(e)}var ok=!err&&JSON.stringify(actual)===JSON.stringify(expected);if(ok)pass++;out.push((ok?'✅':'❌')+' Test '+(i+1)+' expected '+JSON.stringify(expected)+' actual '+(err||JSON.stringify(actual))+' | '+(performance.now()-st).toFixed(3)+' ms')});$('#do').textContent=out.join('\n')+'\n\nRESULT: '+pass+'/'+tests[p].length+' passed';$('#dt').innerHTML=pass===tests[p].length?teach('All visible tests pass.','Now prove the invariant, test larger inputs and state time and space complexity.') : teach('A counterexample failed.','Trace the exact failing input. Ask what your loop or state assumes that the test violates.')}
function broken(){var p=$('#prob').value;if(p==='two')$('#dc').value='function solve(a,target){return [0,1]}';if(p==='max')$('#dc').value='function solve(a){let best=0;for(const x of a)best=Math.max(best+x,0);return best}';if(p==='bin')$('#dc').value='function solve(a,t){let l=0,r=a.length-1;while(l<r){let m=Math.floor((l+r)/2);if(a[m]<t)l=m+1;else r=m-1}return a[l]===t?l:-1}';if(p==='pal')$('#dc').value='function solve(s){return s===s.split("").reverse().join("")}';if(p==='br')$('#dc').value='function solve(s){return true}';}
$('#errors').innerHTML='<div class="card"><h2>🐛 Error Teacher</h2><div class="grid"><div class="panel"><b>Syntax error</b><p>Parser cannot understand the source. Runtime never starts.</p></div><div class="panel"><b>Runtime error</b><p>The program runs until an operation violates its rules.</p></div><div class="panel"><b>Logic error</b><p>The program runs but the answer is wrong. A failing test is evidence.</p></div><div class="panel"><b>Performance error</b><p>The answer may be right but resource growth is unacceptable.</p></div><div class="panel"><b>Async error</b><p>Ordering, rejection or cancellation is wrong.</p></div><div class="panel"><b>Precision error</b><p>Floating-point representation is not exact decimal arithmetic.</p></div></div><div class="teacher"><b>Idiot debugging ritual:</b> reproduce → classify → isolate → inspect → state invariant → smallest fix → rerun → regression test.</div></div>';
show('js');
</script></body></html>
