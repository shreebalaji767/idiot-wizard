*{box-sizing:border-box}body{margin:0;background:#070b14;color:#eef3ff;font:16px/1.7 system-ui,sans-serif}header{padding:30px 18px;text-align:center;position:sticky;top:0;z-index:5;background:#080e19ee;border-bottom:1px solid #2b3a58}h1{font-size:clamp(34px,7vw,70px);line-height:1;margin:0}main{max-width:1200px;margin:auto;padding:18px}.toolbar,.grid{display:grid;gap:14px}.toolbar{grid-template-columns:1fr 220px;margin-bottom:14px}.grid{grid-template-columns:300px 1fr}.panel,.card{background:#101a2c;border:1px solid #2b3a58;border-radius:15px;padding:17px}.topics{height:calc(100vh - 150px);position:sticky;top:135px;overflow:auto}.topic,button,input,select,textarea{font:inherit}.topic,button{cursor:pointer;color:#eef3ff;background:#17243c;border:1px solid #2b3a58;border-radius:9px;padding:10px}.topic{width:100%;text-align:left;margin:4px 0}.topic.active{background:#281a49;border-color:#8b5cf6}input,select,textarea{width:100%;background:#060a12;color:#eef3ff;border:1px solid #2b3a58;border-radius:9px;padding:11px}.idiot{border-left:5px solid #8b5cf6;background:#17112b}.real{border-left:5px solid #38bdf8;background:#0d2030}.danger{border-left:5px solid #ef4444;background:#281216}.lab{border-left:5px solid #22c55e;background:#0c2118}pre{background:#050810;border:1px solid #2b3a58;border-radius:9px;padding:13px;overflow:auto}.out{white-space:pre-wrap;background:#050810;border:1px solid #2b3a58;padding:10px;border-radius:8px}.bad{color:#fca5a5}.good{color:#86efac}.badge{display:inline-block;border:1px solid #2b3a58;border-radius:999px;padding:3px 8px;margin:2px;color:#c4b5fd;font-size:12px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #2b3a58;padding:8px;text-align:left}th{background:#17243c}@media(max-width:850px){.grid,.toolbar{grid-template-columns:1fr}.topics{height:auto;max-height:330px;position:relative;top:0}main{padding:10px}}

<body>
<header><h1>🤡 IDIOT → WIZARD</h1><p>DEEP LEARNING STUDIO — jokes make it memorable; technical rules make it correct.</p></header>
<main>
<div class="toolbar"><input id="search" placeholder="Search closure, recursion, probability, graphs..."><select id="domain"><option>All</option><option>JavaScript</option><option>Mathematics</option><option>DSA</option></select></div>
<div class="grid"><aside class="panel topics" id="topics"></aside><section id="lesson"></section></div>
</main>
<script>
const D=[
["JavaScript","Variables","binding;declaration;initialization;assignment;scope;TDZ;shadowing","A variable declaration creates a binding; scope determines where that binding can be resolved.","A variable is a labelled box. JavaScript has three box factories and one is the weird uncle.","let age=25; const name='Bob'; age=26;","Programs need names for state so humans can reason about changing values.","const prevents reassignment of the binding; it does not freeze an object."],
["JavaScript","Functions","callable value;parameters;arguments;return;scope;closure;higher-order","A function is a callable value containing behavior; calling it executes that behavior with arguments bound to parameters.","A vending machine: inputs in, result out. Forgot return? Congratulations, you bought air.","function add(a,b){ return a+b; } const double=x=>x*2; add(2,3);","Functions package, reuse, compose and test behavior.","Defining a function does not run its body."],
["JavaScript","Closures","lexical environment;scope chain;retained state;factory;encapsulation","A closure is a function together with access to its lexical environment.","The function moved out of the house but stole the spare keys.","function counter(){let n=0;return ()=>++n} const c=counter(); c(); c();","Closures enable factories, callbacks, private state and memoization.","Captured bindings are not automatically frozen copies."],
["JavaScript","this","method call;plain call;new;call;apply;bind;arrow","The value of this follows invocation rules; arrow functions use lexical this.","this is not a mood. It is decided by how the function was invoked.","obj.m(); fn.call(obj); fn.bind(obj); new Person();","Invocation-dependent this supports methods and constructors.","Arrow functions do not create their own this."],
["JavaScript","Promises","pending;fulfilled;rejected;then;catch;finally;composition","A Promise represents eventual settlement and lets asynchronous results be composed.","Restaurant token: pending until food arrives or the kitchen explodes.","doWork().then(use).catch(recover).finally(cleanup);","Promises structure asynchronous results and errors.","A rejected promise must be handled somewhere appropriate."],
["JavaScript","Event loop","call stack;job;microtask;task;timer;Promise","JavaScript schedules queued work around a call stack; promise reactions are microtasks.","The VIP queue gets processed before the normal timer queue.","console.log('A'); setTimeout(()=>console.log('B'),0); Promise.resolve().then(()=>console.log('C')); console.log('D');","The model explains responsive asynchronous execution.","setTimeout(...,0) means eligible later, not now."],
["JavaScript","Objects and prototypes","identity;properties;lookup;prototype chain;descriptors;inheritance","Objects have identity and properties; lookup can continue through a prototype chain.","If your drawer lacks a spoon, ask the parent drawer. Family drama, deterministic rules.","const a={x:1}; const b=Object.create(a); b.x;","Prototype delegation is part of JavaScript's object model.","constructor.prototype and an object's prototype are not the same concept."],
["JavaScript","Errors and debugging","SyntaxError;ReferenceError;TypeError;RangeError;throw;catch;stack trace","Errors are observable failures; debugging is evidence-driven diagnosis.","The error message is a witness statement, not an insult. Read it.","try{risky()}catch(err){console.error(err.stack)} throw new Error('bad');","Failure information makes programs diagnosable.","Catching everything and hiding it can destroy useful evidence."],
["JavaScript","Async and concurrency","async;await;Promise.all;sequential;concurrent;AbortController","async functions return Promises; await suspends that async continuation, not the whole runtime.","Your tiny function pauses for tea. The universe keeps working.","const [a,b]=await Promise.all([getA(),getB()]);","Readable asynchronous code can still run independent work concurrently.","Awaiting independent operations one-by-one can add latency."],
["JavaScript","DOM and events","nodes;selectors;attributes;capture;target;bubble;delegation","The DOM models document structure; events propagate through that structure.","The document is furniture; events are children throwing balls through the room.","const b=document.querySelector('button'); b.addEventListener('click',handler);","Browser applications need programmable documents and interaction.","event.target and event.currentTarget may differ."],
["Mathematics","Functions","domain;codomain;range;mapping;composition;inverse","A function maps every input in its domain to exactly one output.","A legal vending machine: one input, one output for that input.","f(x)=2x+1; (f o g)(x)=f(g(x))","Functions describe transformations, algorithms and models.","Range and codomain are not automatically the same set."],
["Mathematics","Logarithms","base;exponent;inverse;laws;growth;binary search","A logarithm asks which exponent produces a given value.","Exponentiation says 'raise it'. Logarithm interrogates: who told you the exponent?","log_b(x)=y iff b^y=x","Logs describe inverse exponential growth and repeated halving.","log(a+b) is not generally log(a)+log(b)."],
["Mathematics","Modular arithmetic","remainder;congruence;inverse;Euclid;exponentiation","a congruent b modulo n when n divides a-b.","The clock throws away complete 24-hour revolutions and keeps the remainder.","a ≡ b (mod n); (a+b) mod n","Modular arithmetic powers cyclic algorithms, hashing and cryptography.","Division requires an appropriate modular inverse."],
["Mathematics","Probability","sample space;event;conditional;independence;Bayes;expectation;variance","Probability assigns values to events in a model; conditional probability updates that model with information.","Probability is not prophecy. It is disciplined uncertainty under assumptions.","P(A|B)=P(A∩B)/P(B); E[X]=ΣxP(X=x)","Algorithms, experiments and risk reasoning need uncertainty models.","P(A|B) and P(B|A) are generally different."],
["Mathematics","Matrices and linear algebra","vector;matrix;dot product;transformation;determinant;system","Vectors represent quantities and matrices can represent linear transformations and systems.","A matrix is a machine that eats a vector and produces another vector.","A·x=b; det([[a,b],[c,d]])=ad-bc","Linear algebra supports graphics, simulation, optimization and many algorithms.","Matrix multiplication is not element-wise and order matters."],
["Mathematics","Calculus","limit;derivative;rate;integral;area;optimization","Calculus studies continuous change; derivatives measure local rate and integrals accumulate.","Derivative asks how violently it changes now; integral asks how all the tiny pieces add up.","f'(x)=lim(h→0)(f(x+h)-f(x))/h; ∫f(x)dx","It supports optimization, simulation and continuous models.","A derivative's meaning depends on variable and domain."],
["DSA","Big-O complexity","time;space;growth;best;average;worst;amortized","Big-O gives an asymptotic upper growth bound for resource usage.","When input becomes a giant monster, does your algorithm become a bigger monster?","O(1), O(log n), O(n), O(n log n), O(n²)","Scaling determines whether an algorithm remains practical.","Big-O is an abstraction; constants still matter in real systems."],
["DSA","Arrays","index;contiguous;access;insert;delete;traversal","Arrays are ordered indexed collections; middle insertion can require shifting.","Numbered chairs: finding chair 500 is easy; moving everyone behind it is not.","const a=[10,20,30]; a[1]; a.push(40);","Arrays are simple, cache-friendly building blocks.","O(1) indexed access does not make every operation O(1)."],
["DSA","Stacks and queues","LIFO;FIFO;push;pop;enqueue;dequeue;deque","Stacks remove newest items; queues remove oldest items.","Stack = plates. Queue = railway line. Please do not cut FIFO.","stack.push(x); stack.pop(); queue.enqueue(x); queue.dequeue();","They model parsing, undo, scheduling and BFS.","Naive front removal from arrays can be costly."],
["DSA","Hash tables","hash;bucket;collision;chaining;open addressing;load factor","Hash tables map keys toward storage locations while handling collisions.","Two idiots can receive the same house number, so collision handling exists.","index=hash(key) mod capacity","Fast average lookup powers maps, sets, caches and indexes.","Average O(1) is not a universal worst-case guarantee."],
["DSA","Recursion","base case;recursive case;call stack;progress;divide","Recursion reduces a problem to smaller instances until a base case.","A function tells a smaller copy of itself to do the job. Eventually somebody must say STOP.","function fact(n){if(n<=1)return 1;return n*fact(n-1)}","Trees, divide-and-conquer and backtracking naturally use recursion.","Every recursive path needs progress toward termination."],
["DSA","Binary search","sorted;interval;midpoint;invariant;logarithmic","Binary search keeps the answer inside an interval and discards half the candidates repeatedly.","Open the middle book, throw away half the library, repeat.","lo=0; hi=a.length-1; mid=lo+Math.floor((hi-lo)/2);","Halving gives logarithmic search under a suitable ordered predicate.","You need a property that makes discarding one side safe."],
["DSA","Graphs: BFS and DFS","vertex;edge;adjacency;BFS;DFS;visited;component","Graphs model relationships; BFS explores layers and DFS explores deeply.","Social network: BFS meets all friends first; DFS follows one friend into the rabbit hole.","graph[u].push(v); queue.push(start); visited.add(start);","Graphs model networks, dependencies, routes and state spaces.","Cycles require visited-state management."],
["DSA","Dynamic programming","state;transition;base case;memoization;tabulation;overlap","DP stores results of overlapping subproblems using a state and transition.","Stop solving the same stupid problem 400 times. Write the answer on a sticky note.","dp[i]=best(dp[i-1],dp[i-2]);","DP can replace repeated exponential work with tractable computation.","Not every recursion is DP; state and overlapping subproblems matter."],
["DSA","Heaps and priority queues","heap property;complete tree;sift;insert;extract;priority","A heap maintains a priority property that supports efficient insertion and extraction of an extreme-priority element.","Everyone is messy, but the boss stays at the top.","parent=floor((i-1)/2); left=2*i+1; right=2*i+2;","Priority queues support scheduling and graph algorithms.","A heap is not a fully sorted array."]
];

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
let selected=0;
function filtered(){let q=document.getElementById("search").value.toLowerCase(),d=document.getElementById("domain").value;return D.map((x,i)=>[x,i]).filter(z=>(d==="All"||z[0][0]===d)&&(!q||(z[0].join(" ").toLowerCase().includes(q))));}
function renderTopics(){document.getElementById("topics").innerHTML=filtered().map(z=>'<button class="topic '+(z[1]===selected?'active':'')+'" onclick="select('+z[1]+')"><b>'+esc(z[0][1])+'</b><br><small>'+esc(z[0][0])+' · '+z[0][2].split(";").length+' subskills</small></button>').join("")||"<p>No topic.</p>";}
function select(i){selected=i;render();scrollTo(0,0);}
function render(){
let x=D[selected];
let tags=x[2].split(";");
let sub=tags.map((t,i)=>'<div class="card"><h3>'+(i+1)+'. '+esc(t)+'</h3><p><b>🤡 Idiot question:</b> What would break if this did not exist?</p><p><b>🧠 Engineer question:</b> What exact rule governs it?</p><p><b>🧙 Wizard question:</b> What interaction changes its behavior?</p></div>').join("");
document.getElementById("lesson").innerHTML=
'<div class="card"><span class="badge">'+esc(x[0])+'</span>'+tags.map(t=>'<span class="badge">'+esc(t)+'</span>').join("")+'<h2>🤡 '+esc(x[1])+'</h2><p>'+esc(x[3])+'</p></div>'+
'<div class="card idiot"><h2>1. STUPID PICTURE</h2><p><b>'+esc(x[4])+'</b></p><p>Now translate the joke into technical language. If you cannot, you memorized the joke instead of learning the concept.</p></div>'+
'<div class="card real"><h2>2. PRECISE TECHNICAL MEANING</h2><p>'+esc(x[3])+'</p><p>For every noun, identify the thing. For every verb, identify the operation. For every condition, identify the rule that must hold.</p></div>'+
'<div class="card"><h2>3. WHY DOES THIS EXIST?</h2><p>'+esc(x[6])+'</p><p>Every abstraction solves one problem and creates constraints somewhere else. Find both.</p></div>'+
'<div class="card"><h2>4. EVERY SUB-SKILL</h2>'+sub+'</div>'+
'<div class="card"><h2>5. SYNTAX — EVERY TOKEN HAS A JOB</h2><pre>'+esc(x[5])+'</pre><ol><li>Mark keywords.</li><li>Mark identifiers.</li><li>Mark values/literals.</li><li>Mark operators.</li><li>Mark delimiters.</li><li>Explain what each token contributes.</li><li>Remove one token and predict the exact failure.</li></ol></div>'+
'<div class="card"><h2>6. WHAT ACTUALLY HAPPENS?</h2><ol><li>Input enters.</li><li>The relevant grammar/rule is applied.</li><li>Names, values, states or mathematical objects are resolved.</li><li>Intermediate state changes.</li><li>A result, side effect, cost or error emerges.</li><li>The contract and assumptions determine whether that result is valid.</li></ol><p>Replace “the computer just does it” with a trace.</p></div>'+
'<div class="card"><h2>7. PREDICT → RUN</h2><textarea id="predict" placeholder="Write your exact prediction before running..."></textarea><p><b>Exercise:</b> '+esc(x[5])+'</p><button class="primary" onclick="predict()">Record prediction</button><div id="predout" class="out">No prediction recorded.</div></div>'+
'<div class="card danger"><h2>8. BREAK IT</h2><p><b>Known trap:</b> '+esc(x[7])+'</p><textarea id="break" placeholder="Which assumption will you attack?"></textarea><button onclick="breakIt()">Break the assumption</button><div id="breakout" class="out">No break yet.</div></div>'+
'<div class="card"><h2>9. DEBUG LIKE AN IDIOT WHO REFUSES TO GUESS</h2><table><tr><th>Failure</th><th>Meaning</th><th>Correct response</th></tr><tr><td>Syntax</td><td>Grammar failed.</td><td>Read the exact location and construct.</td></tr><tr><td>Runtime</td><td>An operation failed during execution.</td><td>Trace the failing value and operation.</td></tr><tr><td>Logic</td><td>Code ran but intent failed.</td><td>Compare actual state with the invariant/specification.</td></tr><tr><td>Performance</td><td>Work or memory is too costly.</td><td>Measure, identify the bottleneck, then optimize.</td></tr><tr><td>Conceptual</td><td>Your mental model predicted reality incorrectly.</td><td>Find the rule that disproves the model.</td></tr></table></div>'+
'<div class="card lab"><h2>10. PARANOID TESTING</h2><p>Test normal → empty → minimum → maximum practical → boundary → duplicate → invalid → repeated → adversarial. Then add a regression test for every bug you find.</p></div>'+
'<div class="card"><h2>11. CORRECTNESS + COST</h2><textarea id="proof" placeholder="Why is the solution correct? What invariant/rule proves it? What are time, space, numerical or I/O costs?"></textarea><button onclick="check()">Check reasoning</button><div id="proofout" class="out">Write your reasoning.</div></div>'+
'<div class="card"><h2>12. CONNECT THE DOTS</h2><p>Ask: what prerequisite does this use? What later topic depends on it? What changes when it meets functions, scope, objects, async work, data structures or mathematical reasoning?</p></div>'+
'<div class="card"><h2>13. BUILD WITHOUT TUTORIAL</h2><textarea id="build" placeholder="Describe a small independent project. Include inputs, outputs, edge cases, failures and tests."></textarea><button onclick="build()">Check build plan</button><div id="buildout" class="out">No plan yet.</div></div>'+
'<div class="card idiot"><h2>14. FIVE WHYS</h2><p>Why does it work? Why does that rule exist? Why is it useful? What assumption limits it? What evidence would prove your explanation wrong?</p></div>'+
'<div class="card"><h2>15. FINAL IDIOT BOSS</h2><ol><li>Define it without its name.</li><li>Explain the stupid picture.</li><li>Write syntax from memory.</li><li>Predict a new case.</li><li>Run it.</li><li>Break an assumption.</li><li>Diagnose from evidence.</li><li>Fix it.</li><li>Test edge cases.</li><li>State correctness and cost.</li><li>Build a fresh example.</li><li>Teach another idiot.</li></ol><p><b>Wizard condition:</b> you can explain the mechanism, not merely repeat the vocabulary.</p></div>';
}
function predict(){let x=document.getElementById("predict").value.trim();document.getElementById("predout").textContent=x?"Prediction recorded. Now run the example in the Practical Lab and compare reality with your model.":"Write a prediction first. No prediction, no learning.";}
function breakIt(){let x=document.getElementById("break").value.trim();document.getElementById("breakout").textContent=x?"Good. Now create the smallest failing case, capture the exact error/wrong result, identify the violated rule, fix the cause, and rerun.":"Pick one assumption and attack it. Empty input or a boundary is a good start.";}
function check(){let x=document.getElementById("proof").value.trim();document.getElementById("proofout").textContent=x.length<80?"Too vague. State the rule/invariant, why each step preserves it, and the resource cost.":"Good. Now attack your proof with a boundary case and an adversarial input.";}
function build(){let x=document.getElementById("build").value.trim();document.getElementById("buildout").textContent=x.length<100?"Add inputs, outputs, mechanism, edge cases, failure behavior, tests and complexity.":"Solid. Build it without copying, break it deliberately, and add a regression test.";}
document.getElementById("search").oninput=renderTopics;document.getElementById("domain").onchange=renderTopics;render();
</script><script src="pwa.js"></script>
