["Segment tree","range query;update;lazy propagation","Segment trees recursively summarize intervals.","Ask groups for summaries instead of every person.","Build range sum, then lazy range update.","Wrong identity or merge function."],
["Graph representations","adjacency list;matrix;directed;undirected;weighted","Graphs model relationships and representation affects cost.","Dots plus roads; roads may point or charge tolls.","Build list and matrix forms.","Forgetting reverse edges in undirected graphs."],
["BFS","queue;levels;shortest unweighted path;components","BFS explores by distance layers.","A rumor spreads one hop at a time.","Store parents and reconstruct a shortest path.","Marking visited too late."],
["DFS","recursion;stack;components;cycles","DFS explores deeply then backtracks.","Walk the cave until a wall, then remember the route back.","Implement recursive and iterative DFS.","Visited-state errors and recursion depth."],
["Topological sorting","DAG;Kahn;DFS","Topological order puts prerequisites before dependents and exists only for DAGs.","Prerequisites before the boss fight.","Use Kahn's algorithm and detect cycles.","Trying to order a cyclic graph."],
["Dijkstra","nonnegative weights;priority queue;relaxation","Dijkstra repeatedly finalizes the closest unsettled vertex under nonnegative weights.","Always visit the cheapest frontier; negative roads break the promise.","Implement relaxation and path reconstruction.","Using negative edges."],
["Bellman-Ford","relaxation;negative edges;negative cycles","Bellman-Ford relaxes every edge repeatedly and detects reachable negative cycles.","Everyone gets repeated chances to improve.","Run V-1 passes plus one detection pass.","Stopping without knowing why."],
["Floyd-Warshall","all-pairs;DP;intermediate vertices","Floyd-Warshall updates all pairs as each vertex becomes an allowed intermediate.","Let one new middleman help every city pair.","Implement the triple loop and state invariant.","Wrong loop ordering."],
["MST","Kruskal;Prim;cut property","MST connects all vertices at minimum total weight without cycles.","Cheapest roads, no pointless loop.","Implement Kruskal with DSU and Prim with a heap.","Confusing MST and shortest paths."],
["DSU","union-find;path compression;union by size","DSU maintains components with extremely efficient amortized operations.","Each group has a boss; merge groups and ask the boss.","Implement find/union and count components.","Misunderstanding representatives."],
["SCC","Kosaraju;Tarjan;directed connectivity","Strong components group vertices mutually reachable in directed graphs.","Everyone can eventually sneak around and reach everyone else.","Implement Kosaraju or trace Tarjan.","Using undirected connectivity logic."],
["Bridges and articulation","low-link;discovery;vulnerability","Bridges and articulation points expose network failures using DFS low-link values.","Find the road or town whose removal breaks the network.","Compute discovery and low arrays.","Forgetting the DFS-root special case."],
["Brute force","enumeration;pruning;state space","Brute force systematically checks candidates and is useful for small constraints or oracle testing.","Sometimes try everything is the correct answer.","Build a brute-force solver and use it to test a faster one.","Ignoring exponential constraints."],
["Divide and conquer","merge sort;quicksort;recurrence","Split, solve parts, combine.","Cut the monster into pocket-sized monsters.","Trace merge sort and derive its recurrence.","Forgetting combine cost."],
["Greedy","exchange argument;interval scheduling;heap","Greedy chooses local actions when a proof shows they remain globally safe.","Grab the best-looking move only if you can prove future regret is impossible.","Solve interval scheduling and explain the exchange argument.","Assuming every problem is greedy."],
["Backtracking","state;choice;constraint;undo","Backtracking explores choices and undoes them when a branch fails.","Try a door; tiger; back out; next door.","Solve permutations or N-Queens.","Forgetting to undo shared state."],
["Dynamic programming","state;transition;base;memo;tabulation","DP stores overlapping subproblem answers and defines a state transition.","Stop solving the same stupid subproblem 900 times.","Derive Fibonacci, knapsack and grid DP from state meaning.","Coding a table before defining the state."],
["Bitmask DP","subset states;transitions;popcount","Bitmasks encode subsets compactly for small n.","Every bit is a tiny invitation checkbox.","Solve subset assignment/visitation.","Using masks beyond safe numeric representation."],
["Randomized algorithms","random pivots;hashing;expected behavior","Randomization can simplify algorithms or improve expected performance.","Controlled chaos stops some inputs from bullying you.","Compare randomized and deterministic quicksort.","Confusing expected with guaranteed complexity."],
["Network flow","capacity;residual;augmenting path;min-cut","Flow sends quantity through capacity-limited edges using residual graphs.","Water through pipes with widths.","Implement max flow on a small network.","Ignoring residual capacities."],
["Matching","bipartite;augmenting paths","Matching pairs compatible vertices without reusing endpoints.","Everyone wants one dance partner.","Improve a matching with augmenting paths.","Calling maximal matching maximum."],
["Advanced strings","rolling hash;suffix array;trie","Advanced string structures support substring and suffix queries.","Strings become a forest; build maps through suffixes.","Compare rolling hash and deterministic matching.","Assuming hashes never collide."],
["Computational geometry","orientation;cross product;intersection;convex hull","Geometry algorithms rely on orientation tests and careful edge cases.","Cross product tells which way the turn went.","Implement orientation and convex hull.","Floating-point equality and collinear cases."],
["Range and offline queries","sweep line;offline processing;Mo's algorithm","Reordering queries or preprocessing can reduce repeated work.","Answer questions in an order that reuses your previous work.","Compare prefix sums, segment trees and offline processing.","Choosing complexity without matching constraints."],
["Advanced DP","digit DP;tree DP;interval DP;optimization","Advanced DP designs states around digits, trees, intervals or optimized transitions.","The hard part is what one table cell means, not typing it.","Write the state sentence before coding.","States missing information needed for transitions."]

["Debugging","reproduce;isolate;classify;inspect;hypothesis;fix;regression","Debugging is evidence-driven problem solving.","Do not punch the computer. Interrogate the corpse.","Preserve a failing test, isolate the cause, make the smallest fix and retest.","Changing five things at once."],
["Testing strategy","unit;integration;end-to-end;negative;edge cases","Different test levels cover different boundaries.","One guard is not an entire security team.","Design normal, boundary, invalid and interaction tests.","Only testing happy paths."],
["Property-based thinking","invariants;properties;random inputs;counterexamples","Property tests check general truths across many generated inputs.","Do not test one cake; test whether the recipe always produces cake.","Define properties for sorting, sets and graphs.","Random inputs without useful properties."],
["Benchmarking","warmup;repetitions;variance;workload","Good benchmarks control workload, warmup, repetitions and noise.","One stopwatch reading is gossip.","Benchmark several sizes and inspect variance.","Tiny toy inputs only."],

["Git","working tree;staging;commit;branch;merge;rebase","Git records version history as a graph of commits.","A time machine with paperwork.","Branch, commit, inspect history and merge.","Treating Git as only cloud storage."],

const topics=[];for(const [cat,arr] of Object.entries(groups))for(const x of arr)topics.push({cat,title:x[0],tags:x[1],core:x[2],idiot:x[3],doit:x[4],trap:x[5]});
let idx=0,done=JSON.parse(localStorage.getItem("iw_lesson_done")||"{}");
const cats=["ALL",...Object.keys(groups)];cat.innerHTML=cats.map(x=>"<option>"+x+"</option>").join("");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function visible(){let qv=q.value.toLowerCase(),cv=cat.value;return topics.filter(t=>(cv==="ALL"||t.cat===cv)&&(!qv||(t.cat+" "+t.title+" "+t.tags).toLowerCase().includes(qv)))}
function renderList(){let v=visible();stats.textContent=topics.length+" lessons • "+Object.keys(done).length+" completed";list.innerHTML=v.map(t=>{let i=topics.indexOf(t);return "<button class='"+(i===idx?"sel":"")+"' onclick='openTopic("+i+")'>"+(done[i]?"✓ ":"")+esc(t.title)+" <small>("+esc(t.cat)+")</small></button>"}).join("")}
function openTopic(i){idx=i;render();scrollTo({top:0,behavior:"smooth"})}
const TEACH={
"Foundations":["A program is a recipe for a machine that has zero common sense.","Start with values: data the machine can hold. An expression is a question that produces a value. A statement is an instruction that changes what happens. Syntax is the grammar; semantics are the meaning.","Then learn state: a program remembers information, changes it, and makes decisions. Algorithms are the plans; programs are those plans written in an executable language.","Advanced thinking means separating syntax, semantics, runtime behavior, side effects, invariants and failure modes. Never memorize a rule without asking what the engine actually does."],
"Variables":["Imagine the computer has labelled boxes. let gives you a box whose label lives inside its block. const says: THIS LABEL SHALL NOT BE REASSIGNED, but the object inside can still be changed. var is the ancient cupboard that escaped from a museum.","Declaration creates the name. Initialization gives it its first value. Assignment changes the binding later. Scope decides where the name can be seen.","The advanced problem is not 'what is let?' but 'which binding does this identifier resolve to, when is it initialized, and what object does it reference?'"],
"Types":["JavaScript values come in primitive and object forms. Primitive values include string, number, bigint, boolean, undefined, null and symbol.","Think of types as species at a chaotic zoo. A number is not a string wearing a number costume. Objects have identity; primitives are values.","Advanced JavaScript adds coercion, SameValue comparisons, object wrappers, typed arrays and host objects. Learn what operation performs conversion instead of memorizing weird results."],
"Coercion and equality":["JavaScript sometimes sees two things and says, 'Fine, I will translate one.' That is coercion. It can turn strings into numbers, values into booleans, or objects into primitives.","Strict equality avoids the abstract-equality conversion dance. Loose equality has explicit specification rules and historical behavior. Truthiness is a separate concept from equality.","Advanced mastery means predicting ToPrimitive, ToNumber and ToString conversions and recognizing why values such as NaN, -0, null and undefined create traps."],
"Operators":["Operators are tiny machines. + may add numbers or concatenate strings; && and || can return operands rather than booleans; ?? cares specifically about nullish values; ?. stops a property access chain when the receiver is nullish.","Precedence decides grouping, but parentheses are cheaper than brain damage. Learn operands, evaluation order, short-circuiting and side effects.","Advanced work means understanding abstract operations, bitwise 32-bit conversion, BigInt restrictions and the difference between syntax that looks similar and semantics that are different."],
"Control flow":["A program without control flow is a toaster with one button: on. Conditions choose paths; loops repeat work.","Every loop needs a condition and progress toward termination. for, while and do...while express different shapes of repetition. for...of consumes values; for...in walks enumerable property keys.","Advanced control flow means reasoning about invariants, termination, nested loops, labeled control, exceptions and asynchronous control flow."],
"Functions":["A function is a reusable machine: inputs enter, work happens, a result may leave. But JavaScript functions are also values, so they can be stored, passed and returned.","Parameters are the names; arguments are the supplied values. return sends a result back. Callbacks let one function hand another function a job.","Advanced functions include closures, higher-order functions, recursion, composition, currying, partial application, generators and async functions. The key idea is that behavior itself can be data."],
"Scope":["Scope answers one terrifying question: 'Which variable does this name mean?' JavaScript uses lexical scope, so the answer comes from where code is written.","Global, module, function and block scopes form nested environments. Shadowing creates an inner name that hides an outer name. Scope and object lifetime are related but not identical.","Advanced reasoning follows the environment chain step by step. Closures preserve access to lexical environments even after the surrounding function has returned."],
"Hoisting and TDZ":["Hoisting is not JavaScript secretly moving every line upward with a forklift. It is a simplified way to describe declaration instantiation before execution.","var bindings are initialized differently from let and const. A let or const binding exists in its scope but cannot be accessed before initialization: that interval is the Temporal Dead Zone.","Advanced mastery requires distinguishing parsing, environment creation, initialization and execution. Function declarations have their own declaration-instantiation behavior."],
"Closures":["A closure is a function that remembers access to the lexical environment where it was created. The function leaves the house but keeps the keys.","That enables factories, private state, callbacks and functional patterns. The variable is not necessarily copied; the closure can observe the binding itself.","Advanced closure bugs involve loops, mutation, stale state, memory retention and asynchronous callbacks. The cure is understanding bindings, not memorizing 'closure magic'."],
"this":["this is not simply 'the object containing the function.' It is determined by invocation rules for ordinary functions. Method calls, plain calls, new, call/apply/bind and strict mode can produce different results.","Arrow functions are weird in a useful way: they do not create their own this. They capture lexical this.","Advanced mastery means separating lexical scope from dynamic invocation context and understanding constructors, class methods, callbacks and explicit binding."],
"Objects":["An object is a collection of properties with identity. A property has a key and a value, and may also have descriptor rules.","Objects can be mutated, copied shallowly, frozen, sealed or connected to prototypes. Property lookup may continue up a prototype chain.","Advanced object theory includes descriptors, accessors, property attributes, identity, reference sharing, proxies and reflection. The big trap: two objects with identical contents are still different objects."],
"Arrays":["An array is an ordered object-like collection with integer-indexed elements and a length property. It is not a magical mathematical list; it has JavaScript-specific behavior.","Learn traversal, insertion, deletion, slicing, splicing, searching, mapping, filtering, reducing and sorting. Always know whether a method mutates the original or returns a new value.","Advanced array knowledge includes sparse arrays, iterator behavior, species, typed arrays, stable sorting expectations and algorithmic complexity."],
"Strings and Unicode":["A string looks like text, but internally JavaScript stores UTF-16 code units. Human-perceived characters can be much larger conceptual units.","That is why some emoji make length look like the computer has swallowed a calculator. code units, code points and grapheme clusters are different layers.","Advanced text processing requires Unicode normalization, combining marks, locale-aware operations and careful indexing. Never assume string length equals human character count."],
"Numbers":["Number is IEEE-754 double-precision floating point. It is extremely useful and absolutely not magical decimal arithmetic.","Many decimal fractions cannot be represented exactly in binary. Therefore calculations can contain tiny errors. NaN and Infinity are real Number values with special behavior.","Advanced numerical programming means understanding safe integers, rounding, cancellation, overflow, underflow, tolerances and when BigInt or decimal-oriented strategies are more appropriate."],
"Regular expressions":["A regex is a pattern language for recognizing pieces of text. Start with literals, character classes, quantifiers, anchors and groups.","Capturing groups remember text. Lookarounds inspect context without consuming it. Flags modify behavior. Replacement can use captured groups or functions.","Advanced regex means understanding backtracking, greediness, catastrophic backtracking, Unicode modes and the boundary where a parser is better than a giant regex monster."],
"Map and Set":["Set is a nightclub bouncer: one guest identity gets one entry. Map is a cupboard where any suitable key points to a value.","Map keys are not limited to strings. Set and Map use SameValueZero-style equality for membership.","Advanced weak collections are about garbage collection behavior: WeakMap and WeakSet do not keep their object keys alive merely by being referenced weakly."],
"Prototypes":["JavaScript inheritance is prototype-based. If an object cannot find a property, lookup can continue through its prototype chain.","Think of a village of junk drawers. Your drawer does not have the screwdriver, so you ask the parent drawer, then the grandparent.","Advanced understanding separates an object's prototype from a constructor's prototype property and explains property lookup, shadowing and class syntax."],
"Classes":["class syntax gives JavaScript a structured way to describe constructors, methods, fields and inheritance. Underneath, prototype mechanics still exist.","extends connects subclass and parent prototype chains. super accesses parent behavior. static belongs to the class rather than instances. #private fields are language-level private.","Advanced class design means knowing when inheritance is appropriate, when composition is clearer, and how class methods actually live on prototypes."],
"Iterators and generators":["An iterable is something that knows how to produce an iterator. An iterator has next(). A generator is a function that can pause at yield and resume later.","This creates lazy computation: instead of producing everything now, produce the next piece when asked.","Advanced uses include custom protocols, generator delegation, infinite sequences and async iteration. The important mental model is controlled suspension and resumption."],
"Errors":["Errors are information, not insults from the computer. Syntax errors stop parsing; runtime errors happen during execution; logic errors produce valid but incorrect behavior.","throw raises an exception. try/catch can handle it. finally is for cleanup. Error subclasses communicate categories such as TypeError, ReferenceError and RangeError.","Advanced error handling means preserving context, stack traces and causes, handling expected failures deliberately, and never swallowing unknown failures silently."],
"Promises":["A Promise is a representation of a future result. It begins pending and settles once as fulfilled or rejected.","then creates another promise and chains asynchronous transformations. catch handles rejection. finally is for cleanup. Promise.all means 'everyone must finish'; allSettled means 'tell me everyone's fate'; race means 'first settlement wins'; any means 'first success wins.'","Advanced async programming requires understanding promise resolution, thenables, microtasks, cancellation patterns and concurrency limits."],
"async and await":["async functions return promises. await makes asynchronous code read like sequential code while allowing the JavaScript runtime to continue doing other work.","The huge idiot trap is thinking await freezes the browser. It pauses that async function; it does not freeze the entire event loop.","Advanced design distinguishes dependent sequential work from independent concurrent work and uses Promise.all or controlled concurrency where appropriate."],
"Event loop":["JavaScript execution uses a call stack. The host environment schedules tasks, while promise reactions use the microtask queue.","After the current job completes, microtasks are processed before moving on to later tasks, subject to host scheduling rules. That is why a promise callback can appear before a zero-delay timer.","Advanced event-loop reasoning connects scheduling to responsiveness, rendering, race conditions, starvation and long-task performance."],
"Modules":["Modules turn one giant spaghetti file into explicit dependency boundaries. export exposes bindings; import consumes them.","Named exports are imported by name; default exports provide one primary export. Dynamic import loads modules asynchronously.","Advanced module theory includes live bindings, module evaluation order, cyclic dependencies, URL-based resolution in browsers and package resolution in Node."],
"DOM":["The DOM is the browser's object representation of document structure. Elements, text and other nodes form a tree.","Selectors find nodes; creation creates nodes; attributes describe elements; textContent handles plain text; insertion changes the tree; removal detaches nodes.","Advanced DOM work means understanding tree mutation, layout implications, event propagation, accessibility, security and performance."],
"Events":["An event is a message about something that happened. Browser events travel through phases: capture, target and bubble.","event.target is where the event originated; currentTarget is the listener's current element. Delegation uses bubbling so one ancestor can handle many descendants.","Advanced event work covers propagation control, passive listeners, custom events, pointer/keyboard input and lifecycle cleanup."],
"Fetch and HTTP":["HTTP is a request-response protocol. A request has a method, URL, headers and possibly a body. A response has status, headers and a body.","fetch performs requests but does not automatically reject just because an HTTP status is 404 or 500. Network-level failures are different from HTTP error statuses.","Advanced networking includes caching, CORS, credentials, aborting, streaming, retries, idempotency and authentication boundaries."],
"Storage":["localStorage and sessionStorage store strings. IndexedDB stores structured data asynchronously. Cache API stores request/response pairs for web applications.","Storage is browser-managed and has quotas and lifecycle rules. Serialization matters because not every JavaScript value survives JSON conversion.","Advanced offline systems combine IndexedDB, Cache API and service workers while handling versioning, migrations, stale data and consistency."],
"Security":["Security begins with a trust boundary: assume user input, URLs, stored data and network responses can be hostile.","XSS is unintended script execution. CSP restricts resource/script behavior. Same-origin policy separates origins. CORS is a browser-controlled cross-origin access mechanism, not authentication.","Advanced security includes CSRF, prototype pollution, dependency attacks, secure contexts, cookies, authorization, cryptography and defense in depth."],
"Testing strategy":["Testing is not 'click the button once and pray.' Unit tests isolate logic; integration tests check components working together; end-to-end tests exercise realistic flows.","Good tests include normal, boundary, invalid and adversarial cases. A failing test is a reproducible bug report with teeth.","Advanced testing uses fixtures, mocks, spies, coverage, property-based tests and regression suites. Tests should reveal behavior, not merely inflate a percentage."],
"Complexity":["Complexity describes how resource usage changes as input grows. Big-O gives an asymptotic upper-growth description; Big-Theta describes tight growth; Big-Omega describes a lower bound.","An O(n) algorithm doing one million simple operations and an O(n^2) algorithm doing a thousand squared operations may behave differently at small sizes, but asymptotic growth explains scaling.","Advanced analysis includes amortized complexity, recursion trees, lower bounds, space complexity and realistic constant factors."],
"Arrays and prefix sums":["Prefix sums turn repeated range addition into subtraction of accumulated totals. Compute cumulative information once, then answer many range queries cheaply.","The idiot version: instead of recounting the entire pile every time, write a running receipt.","Advanced variants include 2D prefix sums, difference arrays, offline queries and combining prefix techniques with other structures."],
"Two pointers":["Two pointers maintain positions that move through a sequence while exploiting an invariant. Often one moves from each end or both move forward.","It is two idiots holding the same rope and moving only when the invariant says they should.","Advanced two-pointer solutions depend on sorted order, monotonicity or a provable window property. Without that property, the trick is just random finger waving."],
"Sliding window":["A sliding window maintains a contiguous range while expanding and shrinking it to preserve a condition.","Instead of rebuilding the room every time, move the left wall and right wall.","Advanced problems require identifying what information can be updated when an element enters or leaves and proving the window movement does not miss a solution."],
"Kadane":["Kadane's algorithm solves maximum subarray sum by tracking the best sum ending at the current position and the best answer seen so far.","If your current baggage is making the next trip worse, throw the baggage away and start fresh.","The theory is a dynamic-programming invariant: bestEndingHere is either the current value alone or the previous bestEndingHere plus the current value."],
"Linked lists":["A linked list stores nodes connected by references rather than requiring contiguous array-style indexing.","Imagine people holding hands. To reach person number 900, you may need to walk through everyone before them.","Advanced linked-list reasoning uses pointer invariants, fast/slow pointers, cycle detection, reversal and careful mutation order."],
"Stacks":["A stack is Last-In, First-Out. The last plate placed on the pile is the first plate removed.","Stacks naturally model nested work: function calls, parentheses, undo operations and depth-first traversal.","Advanced patterns include monotonic stacks for next-greater problems and expression parsing."],
"Queues and deques":["A queue is First-In, First-Out. A deque allows insertion and removal from both ends.","Think of a line at a shop. A deque gives the line two doors.","Advanced queue design includes circular buffers, monotonic deques and efficient sliding-window algorithms."],
"Priority queues":["A priority queue does not care who arrived first; it cares who has the highest or lowest priority.","Emergency room logic: the person with the urgent problem jumps ahead of the person who arrived carrying a sandwich.","A heap is a common implementation. Advanced use appears in Dijkstra, scheduling, top-k problems and event simulation."],
"Hashing":["Hashing maps keys to positions so lookup can be close to constant average time. Collisions are unavoidable because many possible keys map into limited slots.","Two idiots can be assigned the same locker. Now you need a collision strategy.","Advanced hash tables use chaining or open addressing, load factors, resizing and carefully designed hash functions. Complexity claims depend on assumptions."],
"Binary trees":["A binary tree gives each node at most two children. The shape, not just the values, determines behavior.","Every node can have a left child and a right child. That is the entire basic rule; the chaos comes afterward.","Traversal orders encode different ways of visiting the tree: preorder, inorder, postorder and level order."],
"BST":["A binary search tree maintains an ordering invariant: values in the left region are smaller according to the chosen ordering, and values in the right region are larger.","The tree is a librarian who refuses to search every book because it knows which shelf side to choose.","Advanced BST performance depends on height. A badly shaped tree can collapse toward O(n), motivating balancing."],
"Heaps":["A heap is a nearly complete tree represented efficiently in an array with a parent-child index relationship. A min-heap keeps the smallest item at the root; a max-heap keeps the largest.","The heap does not fully sort everything. It only guarantees the priority relationship needed at the top.","Advanced heap operations support priority queues, top-k selection and graph algorithms."],
"Red-black trees":["A red-black tree is a self-balancing binary search tree maintained by color invariants and rotations.","The tree has a ridiculous dress code, but the dress code prevents it from becoming a long noodle.","The theory is invariant-driven: rotations preserve ordering while recoloring preserves bounded height."],
"Tries":["A trie stores strings by shared prefixes. Each path represents characters, and terminal markers identify complete words.","Words like cat, car and can share the 'ca' hallway before splitting.","Advanced tries support autocomplete, prefix queries and specialized compressed or bitwise variants."],
"Fenwick tree":["A Fenwick tree stores partial sums in a compact structure using binary lowbit relationships.","Instead of remembering every receipt, keep strategically sized bundles so a prefix total can be assembled quickly.","Point updates and prefix queries are logarithmic. Indexing is commonly one-based internally."],
"Segment tree":["A segment tree recursively divides an array into intervals and stores an aggregate for each interval.","Instead of asking every employee for the total, ask managers who already know totals for their departments.","Advanced versions use lazy propagation for efficient range updates and require a correct associative merge/identity design."],
"Graph representations":["A graph is a set of vertices connected by edges. Edges can be directed, undirected, weighted or unweighted.","Cities are vertices; roads are edges. A one-way road is directed. A toll road is weighted.","Adjacency lists save space for sparse graphs; matrices give constant-time edge lookup but use quadratic space."],
"BFS":["Breadth-first search explores a graph in layers. Starting from a source, all distance-1 vertices are processed before distance-2 vertices.","Drop a rumor into a crowd. It spreads one hop at a time.","Because the first time BFS reaches a vertex is through the shortest number of edges in an unweighted graph, it can reconstruct shortest paths with parent pointers."],
"DFS":["Depth-first search follows a path deeply before backtracking.","Walk down the cave until you hit a wall, then walk backward and try the next tunnel.","DFS powers component detection, cycle detection, topological reasoning, low-link algorithms and many recursive graph decompositions."],
"Topological sorting":["A topological order places prerequisites before dependents in a directed acyclic graph.","If 'learn variables' is required before 'learn closures', variables must come first. If prerequisites form a cycle, nobody can start.","Kahn's algorithm repeatedly removes zero-indegree vertices; DFS can construct an order while tracking recursion state."],
"Dijkstra":["Dijkstra repeatedly selects the currently closest unsettled vertex and relaxes its outgoing edges.","Always expand the cheapest known frontier. But if roads can have negative tolls, the logic breaks.","With nonnegative edge weights, a priority queue implementation gives efficient shortest paths. The nonnegative condition is part of the theorem, not decoration."],
"Bellman-Ford":["Bellman-Ford repeatedly relaxes every edge. After V-1 passes, shortest simple paths have had enough opportunities to propagate.","Everyone gets repeated chances to say, 'Actually, I found a cheaper route.'","An additional successful relaxation indicates a reachable negative cycle. The algorithm is slower but handles negative edges."],
"Floyd-Warshall":["Floyd-Warshall computes all-pairs shortest paths through dynamic programming. Each stage asks whether allowing one more intermediate vertex improves a path.","Imagine every city gets invited to stand in the middle of every possible route.","The core invariant is the allowed intermediate set. The classic implementation is O(V^3)."],
"MST":["A minimum spanning tree connects all vertices with minimum total edge weight and no cycle.","Connect every house with roads as cheaply as possible without building a pointless loop.","Kruskal sorts edges and uses DSU; Prim grows one connected tree using a priority queue. MST is not the same problem as shortest path."],
"DSU":["Disjoint Set Union maintains a collection of separate groups. find identifies a representative; union merges groups.","Every group has a boss. Ask the boss who the group is; if two bosses differ, merge the groups.","Path compression and union by size/rank make operations extremely fast amortized, commonly described as near-constant."],
"SCC":["Strongly connected components partition a directed graph into maximal groups where every vertex can reach every other vertex in the group.","Everyone in the club can eventually sneak around and reach everyone else.","Kosaraju uses two DFS passes; Tarjan uses low-link structure in one DFS. SCCs compress naturally into a DAG."],
"Bridges and articulation":["A bridge is an edge whose removal increases the number of connected components. An articulation point is a vertex with that effect.","Find the single road or town whose disappearance breaks the network.","DFS discovery times and low-link values reveal whether a subtree has another route back to an ancestor. The DFS root needs special handling."],
"Brute force":["Brute force systematically tries candidates. It is not stupid when constraints are small; it can also serve as a correctness oracle for faster algorithms.","Sometimes the correct engineering move is to try every door because there are only three doors.","Advanced use includes pruning, meet-in-the-middle and using brute force to test optimized solutions."],
"Divide and conquer":["Divide and conquer splits a problem, solves smaller pieces, then combines their answers.","Cut the monster into smaller monsters. Beat each one. Stitch the victory together.","Merge sort demonstrates the pattern clearly. Recurrences describe how the cost scales across levels."],
"Greedy":["A greedy algorithm makes a locally best choice, but it is correct only when a proof establishes that this choice can be part of an optimal solution.","Do not grab the shiny object merely because it is shiny. Prove the shiny object cannot sabotage the future.","Exchange arguments, cut properties and matroid-like structures explain why particular greedy strategies work."],
"Backtracking":["Backtracking explores a decision tree, abandons impossible branches and undoes choices before trying alternatives.","Open door. Monster. RUN BACK. Undo the mess. Open next door.","Correctness depends on maintaining state and restoring it exactly. Pruning can dramatically reduce the explored search space."],
"Dynamic programming":["Dynamic programming solves overlapping subproblems once and stores their answers. The hardest part is defining what a state means.","If you keep solving the same stupid question, write down the answer. Congratulations, you invented memoization.","A DP needs state, transition, base cases and evaluation order. Advanced DP designs states for trees, intervals, digits, subsets and optimized transitions."],
"Bitmask DP":["A bitmask represents a set using bits. Bit i can mean 'item i is selected.'","A row of tiny light switches becomes your entire subset.","Bitmask DP is powerful when the universe is small enough that 2^n states are feasible. Always analyze the state count before coding."],
"Randomized algorithms":["Randomized algorithms deliberately use random choices. Randomness can avoid consistently bad pivot choices or simplify expected behavior.","Instead of letting the input bully you with the same trap every time, sometimes throw a controlled dice roll into the algorithm.","Expected complexity is not the same as guaranteed complexity. Analyze the probability model and failure cases."],
"Network flow":["Flow sends quantities through directed edges with capacities. Residual graphs represent remaining capacity and the possibility of undoing previous flow choices.","Imagine water pipes. If a pipe holds 10 liters, sending 11 is illegal. The residual network tells you where more water can move and where previous choices can be rerouted.","Max-flow/min-cut theory connects optimization with a structural bottleneck. Ford-Fulkerson, Edmonds-Karp and Dinic build progressively stronger machinery."],
"Matching":["A matching chooses edges so no endpoint is used more than once. In bipartite matching, vertices belong to two sides.","Everyone wants one dance partner, and nobody gets two partners.","Augmenting paths can improve a current matching. A maximal matching cannot be extended greedily, while a maximum matching has the largest possible size."],
"Computational geometry":["Geometry algorithms use algebraic tests to reason about spatial relationships. Orientation and cross products are foundational.","Instead of staring at a triangle and yelling 'looks clockwise,' calculate the orientation.","Advanced geometry must handle collinearity, duplicate points, intersections, precision and convex hull construction."],
"Advanced DP":["Advanced dynamic programming is still ordinary DP wearing a boss costume. The difficulty is choosing a state that contains exactly the information needed for future decisions.","Digit DP tracks constraints digit by digit; tree DP tracks subtree summaries; interval DP chooses split points.","Optimization techniques such as monotonic queues, convex-hull tricks or divide-and-conquer optimization reduce expensive transitions when mathematical conditions allow them."]
};
function teachFor(t){
 const direct=TEACH[t.title];
 if(direct) return direct.map(x=>"<p>"+esc(x)+"</p>").join("");
 const tag=t.tags.split(";").map(x=>x.trim()).filter(Boolean);
 return "<p><b>Start here:</b> "+esc(t.core)+"</p><p><b>Idiot brain:</b> "+esc(t.idiot)+"</p><p><b>Build the theory:</b> Every named item is a subtopic. Learn its definition, purpose, mechanism, assumptions, examples, edge cases, complexity and failure modes before moving on.</p><p><b>Advanced brain:</b> Connect this concept to the surrounding topics, derive why the rule works, and identify what changes when an assumption is removed.</p><ul>"+tag.map(x=>"<li><b>"+esc(x)+"</b>: define it, explain why it exists, give a concrete situation where it matters, and state one trap.</li>").join("")+"</ul>";
}
function theory(t){
  const title=esc(t.title||"This Topic");
  const raw=(t.tags||"").split(";").map(x=>x.trim()).filter(Boolean);
  const glossary=raw.map((p,i)=>"<article class='theory-card'><h4>"+(i+1)+". "+esc(p)+"</h4><p><b>IDIOT BRAIN:</b> "+idiot(p)+"</p><p><b>REAL BRAIN:</b> "+precise(p)+"</p><p><b>WHY IT EXISTS:</b> "+purpose(p)+"</p><p><b>MENTAL MODEL:</b> "+model(p)+"</p><p><b>COMMON TRAP:</b> "+trap(p)+"</p></article>").join("");
  return "<section class='full-theory'><h2>🤡 COMPLETE THEORY: "+title+"</h2><p>This is not a snippet collection. This is the actual lesson. Read the idea, learn the vocabulary, understand the syntax, predict behavior, inspect failures, and only then touch the practical lab.</p><div class='idiot'><h3>🧠 IDIOT → IDIOT FIRST</h3><p>"+chaos(t)+"</p></div><h3>📖 WHAT THIS TOPIC ACTUALLY IS</h3><p>"+definition(t)+"</p><h3>🧱 THEORY MAP — NOTHING SKIPPED</h3>"+glossary+"<h3>✍️ SYNTAX MAP</h3><div class='syntax-box'><p><b>GENERAL FORM:</b> Learn the grammar shape before memorising examples. Identify keywords, names, operators, delimiters, optional pieces, required pieces, and evaluation order.</p><p><b>READING RULE:</b> Never memorise punctuation like a parrot. Say what every token means and what the engine does with it.</p><p><b>ERROR RULE:</b> Wrong syntax is not failure. It is the engine saying, “Your sentence is grammatically cursed.” Read the exact error and repair the grammar.</p></div><h3>🔬 FROM ZERO → ADVANCED</h3><ol><li>Vocabulary: define every word.</li><li>Grammar: recognise the syntax shape.</li><li>Semantics: explain what the syntax means.</li><li>Execution: predict what happens step by step.</li><li>Edge cases: learn where intuition breaks.</li><li>Failure: deliberately identify common mistakes.</li><li>Design: know when this tool should and should not be used.</li><li>Advanced: connect it to runtime behavior, memory, performance, security and other topics.</li></ol><h3>🎯 MASTER IT WITHOUT COPYING</h3><p>Close the examples. Explain the topic aloud from memory: what it is, why it exists, its syntax shape, its rules, its edge cases, its common errors, and one situation where you would deliberately choose a different technique. Then verify your explanation in the practical lab.</p><div class='engineer'><h3>🧑‍💻 ENGINEER CHECKLIST</h3><ul><li>Can you define it precisely?</li><li>Can you recognise valid and invalid syntax?</li><li>Can you predict evaluation/execution?</li><li>Can you explain an error instead of merely fixing it?</li><li>Can you handle boundary cases?</li><li>Can you explain trade-offs?</li><li>Can you connect it to a larger program?</li></ul></div></section>";
}
function idiot(p){return "Imagine "+esc(p)+" is a tiny goblin demanding one job. You give it the wrong thing, it throws a chair. You give it the right thing, it does the job. That is the core idea: learn the rule, then learn exactly where the rule stops working.";}
function precise(p){return "Treat "+esc(p)+" as a defined technical mechanism, not a magic word. Learn its inputs, outputs, state changes, constraints, evaluation rules, interactions with surrounding code, and observable failure modes.";}
function purpose(p){return "It exists because programs need a precise way to represent, transform, control, communicate, store, or reason about information. The useful question is not only “what is it?” but “what problem does it solve?”";}
function model(p){return "Picture "+esc(p)+" as a machine with an input side, rules in the middle, and observable output on the other side. When something goes wrong, inspect which side violated the contract.";}
function trap(p){return "The classic beginner mistake is memorising the spelling while skipping the rule. That produces code that looks plausible but collapses at the first weird input.";}
function chaos(t){return "Welcome to "+esc(t.title||"the topic")+", where your brain arrives wearing a bicycle helmet and JavaScript arrives riding a meteor. First we remove the scary vocabulary. Then we learn the grammar. Then we learn what the engine actually does. Then we intentionally break the rule. Finally, we rebuild the idea so you can explain it without copying anybody.";}
function definition(t){return "The topic is a complete concept, not a single code fragment. You should be able to describe its purpose, vocabulary, syntax family, execution model, edge cases, errors, limitations, and relationship to neighbouring concepts. The lesson below expands every named subtopic instead of treating the curriculum label as a checkbox.";}

function renderLesson(){let t=topics[idx],pct=Math.round(Object.keys(done).length/topics.length*100);return "<div class='hero'><div class='crumb'>"+esc(t.cat)+" / "+esc(t.title)+"</div><h1>"+esc(t.title)+"</h1><p><b>Coverage:</b> "+esc(t.tags)+"</p><div class='progress'><div class='fill' style='width:"+pct+"%'></div></div></div><section class='card'><h2>🧠 What is this?</h2><p>"+esc(t.core)+"</p><div class='idiot'><h2>🤡 IDIOT → IDIOT explanation</h2><p>"+esc(t.idiot)+"</p><p><b>Human translation:</b> "+esc(t.core)+"</p></div><div class='engineer'><h2>🧑‍💻 Precise theory</h2><p><b>Core rule:</b> "+esc(t.core)+"</p>"+theory(t)+"<p><b>Professional checklist:</b> definition → mechanism → constraints → complexity → edge cases → failure modes → testing.</p></div><div class='try'><h2>🧪 Do it for real</h2><p>"+esc(t.doit)+"</p><pre>Predict → implement → test normal → test boundaries → break it → debug → fix → regression-test → explain.</pre></div><div class='trap'><h2>💀 Common idiot trap</h2><p>"+esc(t.trap)+"</p></div><h2>🎯 Mastery test</h2><p>Without looking: define every listed subtopic, demonstrate one example, explain one edge case, name a failure mode, and explain when this concept is useful.</p><div class='actions'><button class='primary' onclick='complete()'>✓ I can explain it</button><button onclick='prev()'>← Previous</button><button onclick='next()'>Next →</button></div></section>";}
function complete(){done[idx]=true;localStorage.setItem("iw_lesson_done",JSON.stringify(done));render()}
function next(){idx=(idx+1)%topics.length;render();scrollTo(0,0)}
function prev(){idx=(idx-1+topics.length)%topics.length;render();scrollTo(0,0)}
function render(){renderList();main.innerHTML=renderLesson()}
q.oninput=renderList;cat.onchange=renderList;render();
</script></body></html>
