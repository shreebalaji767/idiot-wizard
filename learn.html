function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function visible(){const q=search.value.trim().toLowerCase(),cat=category.value;return topics.filter(t=>(cat==="ALL"||t.cat===cat)&&(!q||(t.cat+" "+t.title+" "+t.tags).toLowerCase().includes(q)));}
function renderList(){const v=visible();stats.textContent=topics.length+" lessons • "+Object.keys(done).length+" completed";list.innerHTML=v.map(t=>{const i=topics.indexOf(t);return '<button class="'+(i===idx?"sel":"")+'" data-i="'+i+'">'+(done[i]?"✓ ":"")+escapeHtml(t.title)+' <small>('+escapeHtml(t.cat)+')</small></button>';}).join("");list.querySelectorAll("button").forEach(b=>b.onclick=()=>{idx=Number(b.dataset.i);render();window.scrollTo({top:0,behavior:"smooth"});});}
function domain(t){if(t.cat==="JavaScript")return ["CODING","JavaScript is an executable language. The goal is not to turn every line into mathematics. Use mathematical reasoning where it clarifies values, logic, complexity, memory or correctness, then turn that reasoning into valid executable behaviour."];if(t.cat==="Mathematics")return ["MATHEMATICS","Mathematics asks what is true, why it is true, what assumptions are being made, and how a result can be derived or proved. Coding can calculate an example, but an example is not automatically a proof."];if(t.cat==="DSA")return ["CODING + MATH","DSA is the bridge. Mathematics explains invariants, counting, recurrence, probability, graphs and complexity; coding represents the data and executes the algorithm. A mathematically correct algorithm can still have a buggy implementation."];return ["ENGINEERING","Engineering turns knowledge into reliable systems. Define the contract, observe behaviour, test boundaries, measure cost and handle failure instead of trusting appearances."];}
function paragraph(t,kind){const [d,desc]=domain(t);const terms=t.tags.split(";").map(x=>x.trim()).filter(Boolean);const termText=terms.length?terms.join(", "):t.title;return '<p><b>'+kind+' — '+escapeHtml(t.title)+':</b> '+escapeHtml(t.core)+' The useful mental model is that '+escapeHtml(t.title)+' is not a magic phrase to memorize; it is a mechanism with inputs, rules, behaviour and limits. In this lesson we will use the vocabulary '+escapeHtml(termText)+', because names matter: if you cannot name the moving parts, you cannot reliably reason about them. '+escapeHtml(desc)+' When you encounter a new problem, first state what you know, what must happen, and what evidence would convince you that your explanation is correct.</p>';}
function syntax(t){if(t.cat==="Mathematics")return '<pre>Notation is part of the language of mathematics. Write the quantities, assumptions, operators and relationships explicitly. Example pattern: given inputs → apply a stated rule → derive a result → check the assumptions.</pre>';return '<pre>// General programming pattern\ninput → state/data → operation → result → test\n\n// Do not memorize punctuation alone. Ask what each token means.</pre>';}
function fullLesson(t){
  const terms=t.tags.split(";").map(x=>x.trim()).filter(Boolean);
  const d=domain(t);
  const absurd={
    "Foundations":"You are the boss of a very literal robot. You say one tiny wrong thing and the robot confidently does the wrong thing at 900 million operations per second.",
    "Variables":"Imagine a cupboard with a name sticker. The sticker says where to look; it is not the potato itself. Congratulations: your cupboard has become programming.",
    "Types":"Imagine a restaurant where you hand the waiter a number, a string, a boolean and a mysterious potato. The waiter needs to know what kind of thing each one is before doing the appropriate nonsense.",
    "Functions":"A function is a reusable machine. You feed it ingredients, it performs its recipe, and it may hand you food back. Do not confuse the recipe with the cake.",
    "Arrays":"An array is a row of numbered boxes. If you ask for box 0, JavaScript does not say 'humans start counting at one'. It opens box zero and stares at you.",
    "Objects":"An object is a labelled cupboard full of related things. You can put values behind names, retrieve them, change them, and accidentally build a cupboard inside another cupboard.",
    "Scope":"Scope is the computer's VIP guest list. A variable can be visible in one room while being completely nonexistent in another room.",
    "Closures":"A closure is when a function leaves a room but somehow takes its backpack of remembered variables with it. JavaScript calls this normal. The idiot calls it witchcraft.",
    "Promises":"A Promise is a receipt for work that has not finished yet. It is not the result. It is the computer saying, 'I have your order; stop screaming and wait.'",
    "async and await":"async/await is JavaScript putting a tiny polite pause sign into asynchronous code. It does not freeze the universe; it lets the function wait for a Promise.",
    "Event loop":"JavaScript has one main worker trying to juggle synchronous work, callbacks and microtasks without dropping the flaming knives.",
    "Recursion":"Recursion is a function calling itself. This sounds intelligent until you forget the stopping condition and create an infinite meeting where everyone is the same employee.",
    "Complexity":"Big-O is the mathematical way of asking how badly your algorithm behaves when the input becomes enormous. Ten items can hide a terrible algorithm. Ten billion cannot.",
    "Arrays and prefix sums":"A prefix sum is a running total. Instead of repeatedly adding the same pile of bananas, you calculate cumulative banana wealth once and reuse it.",
    "Two pointers":"Two pointers are two idiots walking through the same data while following rules that let them avoid checking every possible pair.",
    "Sliding window":"A sliding window is a moving camera pointed at part of your data. Instead of rebuilding the whole view every time, update what entered and what left.",
    "Binary search":"Binary search is the world's most efficient way to ask a sorted list, 'Which half of you contains my stupid number?'",
    "BFS":"BFS explores a graph layer by layer, like an idiot standing at a building and visiting everyone one floor away before going two floors away.",
    "DFS":"DFS walks as far as possible down one path before coming back. It is the algorithmic version of opening one cupboard, finding another cupboard, and refusing to stop.",
    "Probability":"Probability measures uncertainty. It is mathematics admitting, 'We do not know exactly what will happen, so let us quantify how possible each outcome is.'",
    "Variables":"A variable is a named binding to a value. The computer does not see the English meaning of the name; it follows the language rules.",
    "Functions":"A function packages behaviour so it can be invoked repeatedly with different inputs."
  };
  const stupid=absurd[t.title]||("Imagine two idiots. One idiot knows absolutely nothing about "+t.title+". The other idiot knows the rules but explains them badly. This lesson forces the second idiot to explain the idea until the first idiot can predict what happens before the computer or mathematics is allowed to answer.");
  let h='<section class="card"><h2>🤡 1. IDIOT #1 MEETS IDIOT #2</h2><div class="idiot"><p><b>Idiot picture:</b> '+escapeHtml(stupid)+'</p><p><b>Idiot #2 says:</b> '+escapeHtml(t.idiot)+'</p><p>Now the joke is over for exactly long enough to become dangerous: we replace the silly picture with the precise rule. If the silly picture and the technical rule ever disagree, <b>the technical rule wins</b>.</p></div></section>';
  h+='<section class="card"><h2>🧠 2. WHAT THIS ACTUALLY IS</h2><p><b>Precise rule:</b> '+escapeHtml(t.core)+'</p><p>Do not memorize that sentence like a parrot who has discovered a textbook. Ask what the topic takes as input, what rules it applies, what it produces, what state it changes, and what assumptions make the rule valid. That turns a definition into a usable mental model.</p><p>'+escapeHtml(d[1])+'</p><p>The professional version of the idiot question is: <b>“What must be true for this to work, and how can I prove or test that it is true?”</b></p></section>';
  h+='<section class="card"><h2>🔤 3. EVERY WORD IS A PIECE OF THE MACHINE</h2>';
  terms.forEach((term,i)=>{h+='<div class="step"><h3>'+String(i+1)+'. '+escapeHtml(term)+'</h3><p><b>Idiot translation:</b> Imagine '+escapeHtml(term)+' is a character in a stupid cartoon. What job does this character perform?</p><p><b>Technical translation:</b> Connect '+escapeHtml(term)+' directly to '+escapeHtml(t.title)+'. State what it means, what it can affect, and what changes if its conditions change.</p><p><b>Proof by idiot:</b> Give one normal example and one example where your first intuition fails. If you cannot do both, the concept is still wearing a disguise.</p></div>';});
  h+='</section>';
  h+='<section class="card"><h2>✍️ 4. SYNTAX / NOTATION — ONE TOKEN AT A TIME</h2><p>Syntax is not decoration. Every keyword, symbol, bracket, comma, operator or mathematical symbol has a job. Read it left to right and ask what each piece contributes.</p><pre>'+escapeHtml(t.cat==="Mathematics"?"given quantities → stated assumptions → operation/derivation → result → verification":"input → declaration/data → operation → result → test")+'</pre><p>Never learn syntax as a magic spell. Learn the meaning of every token and the rules governing how the tokens combine.</p></section>';
  h+='<section class="card"><h2>⚙️ 5. SLOW-MOTION IDIOT EXECUTION</h2><p>STOP. Do not run anything yet. First predict. Write down the starting state, apply one rule, record the intermediate state, apply the next rule, and continue. Only then run or calculate.</p><div class="step"><b>1.</b> What are the inputs?<br><b>2.</b> What rule applies first?<br><b>3.</b> What is the intermediate result?<br><b>4.</b> What changes next?<br><b>5.</b> What is the final result?<br><b>6.</b> Did reality agree with your prediction?</div><p>If you predicted incorrectly, excellent. You have just discovered a bug in your brain, which is much cheaper to fix than a production server.</p></section>';
  h+='<section class="card"><h2>💥 6. BREAK THE IDIOT</h2><div class="trap"><p><b>Known trap:</b> '+escapeHtml(t.trap)+'</p></div><p>Now attack the concept deliberately. Change a boundary. Remove an input. Use an empty value. Reverse an assumption. Make the data enormous. Repeat a value. Give an invalid value. In mathematics, change the domain or assumption. In code, introduce a syntax, runtime or logic mistake.</p><p>The goal is not to embarrass the idiot. The goal is to discover the exact boundary between “works” and “does not work.”</p></section>';
  h+='<section class="card"><h2>🐛 7. DEBUG THE IDIOT</h2><p>When the result is wrong, do not randomly edit everything until the computer accidentally forgives you. Freeze the failing example. Record the expected result and actual result. Find the smallest failing case. Identify whether the problem is syntax, runtime, logic, data, assumption, precision or complexity. Change one thing. Run again. Repeat.</p><p>For mathematics, perform the equivalent investigation: check assumptions, signs, algebraic transformations, units, boundary cases and an independent calculation. A calculator can verify arithmetic; it cannot rescue a bad model.</p></section>';
  h+='<section class="card"><h2>🧪 8. CORRECTNESS IS THE BOSS</h2><p>A result looking reasonable does not make it correct. State the contract: what must the result mean? State the assumptions: when is the rule valid? State the invariant: what must remain true while the process runs? Then test ordinary cases and hostile edge cases.</p><p>For algorithms, also state cost. For numerical mathematics, state precision and approximation limits. For JavaScript, distinguish language rules from browser/runtime behaviour. For DSA, distinguish the mathematical algorithm from its implementation.</p></section>';
  h+='<section class="card"><h2>🏗️ 9. BUILD IT WITHOUT HOLDING THE IDIOT’S HAND</h2><div class="build"><p>'+escapeHtml(t.doit)+'</p><p>Start from a blank page. Write the contract. Choose the representation. Implement the smallest version. Test it. Break it. Fix it. Add an edge case. Measure it when measurement matters. Then explain the design in your own words.</p></div></section>';
  h+='<section class="card"><h2>🔗 10. WHY THIS MATTERS ELSEWHERE</h2><p>'+escapeHtml(d[1])+'</p><p>Connect '+escapeHtml(t.title)+' to its prerequisites and consequences. Ask: what topic becomes easier after this? What bug becomes easier to diagnose? What algorithm or mathematical idea depends on it? A wizard is not someone who memorizes 139 isolated facts. A wizard sees the wires connecting them.</p></section>';
  h+='<section class="card"><h2>👑 11. FINAL IDIOT BOSS FIGHT</h2><p>Close the lesson. Now teach <b>'+escapeHtml(t.title)+'</b> to another idiot without reading the page. Define it. Explain every term. Write the syntax or notation. Predict an example. Run or calculate it. Break it. Diagnose the failure. Fix it. Give an edge case. State correctness. State cost or limits. Explain when it should and should not be used.</p><p><b>If you can only repeat the paragraph, you memorized it. If you can predict, break, debug and teach it, you learned it.</b></p><div class="actions"><button class="action primary" onclick="complete()">✓ I mastered this</button><button class="action" onclick="prev()">← Previous</button><button class="action" onclick="next()">Next →</button></div></section>';
  return h;
}
function render(){const t=topics[idx];const pct=Math.round(Object.keys(done).length/topics.length*100);const d=domain(t);main.innerHTML='<section class="hero"><div class="crumb">'+escapeHtml(t.cat)+' / '+escapeHtml(t.title)+'</div><h1>'+escapeHtml(t.title)+' — IN DEPTH</h1><p><b>Coverage:</b> '+escapeHtml(t.tags)+'</p><p><b>Standard:</b> zero → theory → syntax/notation → execution → break → debug → correctness → cost → build → teach.</p><div class="progress"><div class="fill" style="width:'+pct+'%"></div></div></section><section class="card"><h2>🧭 CODING ↔ MATHS</h2><p><b>'+d[0]+'</b></p><p>'+escapeHtml(d[1])+'</p></section>'+fullLesson(t);renderList();}
function complete(){done[idx]=Date.now();localStorage.setItem("iw_lesson_done",JSON.stringify(done));render();}
function next(){idx=(idx+1)%topics.length;render();window.scrollTo({top:0,behavior:"smooth"});}
function prev(){idx=(idx-1+topics.length)%topics.length;render();window.scrollTo({top:0,behavior:"smooth"});}
search.oninput=renderList;category.onchange=renderList;render();
</script>

</body>
