const topics=[];
for(const [cat,arr] of Object.entries(groups))for(const x of arr)topics.push({cat,title:x[0],tags:x[1],core:x[2],idiot:x[3],doit:x[4],trap:x[5]});
const search=document.getElementById("search"),category=document.getElementById("category"),stats=document.getElementById("stats"),list=document.getElementById("list"),main=document.getElementById("main");
const done=JSON.parse(localStorage.getItem("iw_lesson_done")||"{}");
let idx=0;
category.innerHTML=["ALL",...Object.keys(groups)].map(x=>'<option>'+escapeHtml(x)+'</option>').join("");
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function visible(){const q=search.value.trim().toLowerCase(),cat=category.value;return topics.filter(t=>(cat==="ALL"||t.cat===cat)&&(!q||(t.cat+" "+t.title+" "+t.tags).toLowerCase().includes(q)));}
function renderList(){const v=visible();stats.textContent=topics.length+" lessons • "+Object.keys(done).length+" completed";list.innerHTML=v.map(t=>{const i=topics.indexOf(t);return '<button class="'+(i===idx?"sel":"")+'" data-i="'+i+'">'+(done[i]?"✓ ":"")+escapeHtml(t.title)+' <small>('+escapeHtml(t.cat)+')</small></button>';}).join("");list.querySelectorAll("button").forEach(b=>b.onclick=()=>{idx=Number(b.dataset.i);render();window.scrollTo({top:0,behavior:"smooth"});});}
function domain(t){if(t.cat==="JavaScript")return ["CODING","JavaScript is an executable language. The goal is not to turn every line into mathematics. Use mathematical reasoning where it clarifies values, logic, complexity, memory or correctness, then turn that reasoning into valid executable behaviour."];if(t.cat==="Mathematics")return ["MATHEMATICS","Mathematics asks what is true, why it is true, what assumptions are being made, and how a result can be derived or proved. Coding can calculate an example, but an example is not automatically a proof."];if(t.cat==="DSA")return ["CODING + MATH","DSA is the bridge. Mathematics explains invariants, counting, recurrence, probability, graphs and complexity; coding represents the data and executes the algorithm. A mathematically correct algorithm can still have a buggy implementation."];return ["ENGINEERING","Engineering turns knowledge into reliable systems. Define the contract, observe behaviour, test boundaries, measure cost and handle failure instead of trusting appearances."];}
function paragraph(t,kind){const [d,desc]=domain(t);const terms=t.tags.split(";").map(x=>x.trim()).filter(Boolean);const termText=terms.length?terms.join(", "):t.title;return '<p><b>'+kind+' — '+escapeHtml(t.title)+':</b> '+escapeHtml(t.core)+' The useful mental model is that '+escapeHtml(t.title)+' is not a magic phrase to memorize; it is a mechanism with inputs, rules, behaviour and limits. In this lesson we will use the vocabulary '+escapeHtml(termText)+', because names matter: if you cannot name the moving parts, you cannot reliably reason about them. '+escapeHtml(desc)+' When you encounter a new problem, first state what you know, what must happen, and what evidence would convince you that your explanation is correct.</p>';}
function syntax(t){if(t.cat==="Mathematics")return '<pre>Notation is part of the language of mathematics. Write the quantities, assumptions, operators and relationships explicitly. Example pattern: given inputs → apply a stated rule → derive a result → check the assumptions.</pre>';return '<pre>// General programming pattern\ninput → state/data → operation → result → test\n\n// Do not memorize punctuation alone. Ask what each token means.</pre>';}
function fullLesson(t){const terms=t.tags.split(";").map(x=>x.trim()).filter(Boolean);let h='<section class="card"><h2>🤡 1. START LIKE AN IDIOT</h2><div class="idiot"><p>Imagine a machine that is extremely fast, extremely literal, and has absolutely no idea what you meant. That machine is our student. '+escapeHtml(t.idiot)+' The joke is useful because the real skill is removing the joke: after the funny picture, we replace it with a precise model.</p><p>'+escapeHtml(t.core)+' If you remember only one sentence at the beginning, remember this: <b>never trust your first mental picture; make the rule precise and test it.</b></p></div></section>';
h+='<section class="card"><h2>🧠 2. REAL THEORY — IN PARAGRAPHS</h2>'+paragraph(t,"The problem")+
paragraph(t,"The mechanism")+paragraph(t,"The important distinction")+
'<p>Beginners often stop when an example produces the expected answer. That is not enough. A single example can agree with a wrong theory. Professional learning therefore moves from example to rule, from rule to edge cases, and from edge cases to evidence. Ask what happens when an input is empty, huge, negative, repeated, missing, malformed or exactly on a boundary. Ask whether the operation changes state, returns a new value, mutates an existing value, throws an error, loses precision or becomes expensive. These questions turn a definition into working knowledge.</p>'+
'<p>Another important habit is separating <b>what</b> from <b>why</b> and <b>how</b>. What is the rule? Why does the rule exist? How does the environment execute it? A syntax form is only the surface. Underneath it are values, evaluation order, data representation, control flow, memory, mathematical relationships and constraints. If two approaches both produce the same visible result, investigate their assumptions and cost before declaring them equivalent.</p>'+
'<p>For '+escapeHtml(t.title)+', the professional question is not “Can I repeat the definition?” It is “Can I predict behaviour before running it, explain behaviour after running it, and identify the smallest change that would make my prediction wrong?” That ability is the beginning of debugging and proof-oriented thinking.</p></section>';
h+='<section class="card"><h2>🔤 3. EVERY TERM IS MACHINERY</h2>';terms.forEach((term,i)=>{h+='<div class="step"><h3>'+(i+1)+'. '+escapeHtml(term)+'</h3><p><b>Idiot meaning:</b> '+escapeHtml(term)+' is one named piece of the puzzle. Do not let the fancy word scare you.</p><p><b>Technical meaning:</b> connect the term to '+escapeHtml(t.title)+', identify its inputs and outputs, and state what changes when its conditions change.</p><p><b>Failure mode:</b> using the word correctly in a sentence while having no operational model. Fix that by constructing an example, a counterexample and an edge case.</p></div>';});h+='</section>';
h+='<section class="card"><h2>✍️ 4. SYNTAX / NOTATION</h2><p>Syntax is the legal shape of an expression; notation is the compact language used to communicate mathematical structure. Learn it token by token instead of chanting it like a spell.</p>'+syntax(t)+'<p>For every symbol, punctuation mark, keyword or operator, ask: what does it bind to, what value does it produce, what state does it change, what precedence applies, and what happens if the assumption is violated? That is how syntax becomes understanding instead of decoration.</p></section>';
h+='<section class="card"><h2>⚙️ 5. SLOW-MOTION EXECUTION</h2><p>Before running anything, predict the state after each meaningful step. Identify the inputs, evaluate the first operation, record the intermediate result, apply the next rule and continue until the final result. Then compare your prediction with reality. If you were wrong, do not erase the wrong prediction. It is evidence about your mental model.</p><pre>STEP 1 → identify inputs\nSTEP 2 → apply the rule\nSTEP 3 → record intermediate state\nSTEP 4 → continue evaluation\nSTEP 5 → inspect final result\nSTEP 6 → compare prediction with reality</pre></section>';
h+='<section class="card"><h2>💥 6. BREAK THE HAPPY PATH</h2><div class="trap"><p>'+escapeHtml(t.trap)+'</p></div><p>Now deliberately attack the concept. Remove an input. Change a type. Use a boundary value. Reverse an assumption. Give the largest reasonable value. Repeat a value. Use an empty structure. For mathematics, change the domain or assumption and see whether the statement remains true. For code, introduce one character of invalid syntax, one wrong variable name, one off-by-one boundary or one incorrect condition. The goal is not to be clever; the goal is to make hidden assumptions visible.</p></section>';
h+='<section class="card"><h2>🐛 7. DEBUGGING / CORRECTION</h2><p>When reality disagrees with your prediction, freeze the problem. Record the exact input and exact output or error. Reduce the example until the smallest failing case remains. Then identify whether the failure is syntax, runtime, logic, data, assumption, precision or complexity. Change one thing, rerun, and verify. Randomly changing ten lines is not debugging; it is hoping the computer gets bored and fixes itself.</p><p>For mathematics, the same discipline appears as checking assumptions, dimensions, signs, boundary cases, algebraic transformations and independent calculations. A calculator can confirm arithmetic, but it cannot automatically prove that your model was appropriate.</p></section>';
h+='<section class="card"><h2>🧪 8. CORRECTNESS, COST AND LIMITS</h2>'+paragraph(t,"Correctness")+ '<p>Correctness means the result satisfies the stated contract under the stated assumptions. Complexity asks how resource use changes as the input grows. Precision asks how closely a representation or numerical method approximates the intended mathematical value. These are different questions. A program can be fast but wrong, correct but too slow, or correct for ordinary inputs but fail at a boundary.</p><p>State the invariant that must remain true. State the assumptions under which it is true. State the resource cost. State what can go wrong. This habit scales from elementary arithmetic to advanced algorithms and production systems.</p></section>';
h+='<section class="card"><h2>🏗️ 9. BUILD WITHOUT COPYING</h2><div class="build"><p>'+escapeHtml(t.doit)+'</p><p>Build it from a blank file or a blank function. First write the contract in plain language. Then choose the representation. Then implement the smallest working version. Then add an edge case. Then test it. Finally explain why the implementation matches the rule and what its cost is.</p></div></section>';
h+='<section class="card"><h2>🔗 10. CONNECT IT TO THE CURRICULUM</h2><p>'+escapeHtml(domain(t)[1])+'</p><p>Knowledge becomes durable when one idea can explain another. Connect '+escapeHtml(t.title)+' to its prerequisites, its consequences and at least one real use. Ask what breaks if the prerequisite is removed. Ask what becomes possible once this topic is mastered. This prevents the curriculum from becoming a pile of unrelated trivia.</p></section>';
h+='<section class="card"><h2>👑 11. FINAL IDIOT BOSS</h2><p>Close the lesson. Without looking back, define <b>'+escapeHtml(t.title)+'</b>. Explain every coverage term: '+escapeHtml(terms.join(", "))+'. Write its syntax or notation. Work an example. Predict before execution. Break one assumption. Diagnose the failure. Fix it. Give an edge case. State correctness conditions. State cost or precision limits. Compare an alternative. Then teach the whole idea to another idiot without using the original page.</p><div class="actions"><button class="action primary" onclick="complete()">✓ I mastered this</button><button class="action" onclick="prev()">← Previous</button><button class="action" onclick="next()">Next →</button></div></section>';
return h;}
function render(){const t=topics[idx];const pct=Math.round(Object.keys(done).length/topics.length*100);const d=domain(t);main.innerHTML='<section class="hero"><div class="crumb">'+escapeHtml(t.cat)+' / '+escapeHtml(t.title)+'</div><h1>'+escapeHtml(t.title)+' — IN DEPTH</h1><p><b>Coverage:</b> '+escapeHtml(t.tags)+'</p><p><b>Standard:</b> zero → theory → syntax/notation → execution → break → debug → correctness → cost → build → teach.</p><div class="progress"><div class="fill" style="width:'+pct+'%"></div></div></section><section class="card"><h2>🧭 CODING ↔ MATHS</h2><p><b>'+d[0]+'</b></p><p>'+escapeHtml(d[1])+'</p></section>'+fullLesson(t);renderList();}
function complete(){done[idx]=Date.now();localStorage.setItem("iw_lesson_done",JSON.stringify(done));render();}
function next(){idx=(idx+1)%topics.length;render();window.scrollTo({top:0,behavior:"smooth"});}
function prev(){idx=(idx-1+topics.length)%topics.length;render();window.scrollTo({top:0,behavior:"smooth"});}
search.oninput=renderList;category.onchange=renderList;render();
</script>
